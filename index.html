<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#safe{position:fixed;left:0;top:0;width:1px;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script src="engine.js"></script>
<script src="niveaux.js"></script>
<script>
// ===== Jeu (portée globale : partagée avec editeur.js) =====
const APP_VERSION = 99; // à garder égal au numéro de CACHE dans sw.js
const SPEED_BAR_MAX = 200; // vitesse affichée en barre pleine (m/s)
const FONT = 'system-ui,-apple-system,sans-serif';

const cv = document.getElementById('c'); let ctx = cv.getContext('2d'); // ctx est prêté au dessin du vaisseau dans la fenêtre du centre de gravité
const safeEl = document.getElementById('safe');

let W, H, dpr, safeTop, safeBot, bandTop, gameH, scale, ox, oy, baseOy = 0, camY = 0, baseScale = 1, baseOx = 0, ctrl = { x: 0, y: 0, r: 50 }, bgStars = [];
let lvl = 0, L, ship, fuel, state = 'play', stateT = 0, msg = '', sub = '', idleT = 0;
let mission, departed = false, elapsed = 0, result = null, textures = [];
let wt = 0, launched = false, B = []; // temps monde (depuis le premier jet), astres à cet instant
// niveaux : ceux publiés depuis l'éditeur (sur cet appareil) remplacent ceux de niveaux.js
let LV = LEVELS;
try { const pub = JSON.parse(localStorage.getItem('orbite-niveaux-publies') || 'null'); if (Array.isArray(pub) && pub.length) LV = pub.length < LEVELS.length ? pub.concat(LEVELS.slice(pub.length)) : pub; } catch (e) {} // niveaux publiés sur l'appareil : complétés par les nouveaux niveaux officiels
let selPlanet = -1, taps = [], plan = null, planJob = null;
let showHelp = false, helpRes = null, helpJob = null;
let auto = null, simFlight = false, curTh = null, shadowNow = false, predHit = -1; // predHit : astre que touche la trajectoire prévue (−1 = aucun)
let tip = null, touches = new Map(), particles = []; // touches : doigts posés sur la commande (plusieurs à la fois)
let medals = {};
let screen = 'home', homeTex = null; // écrans : accueil, liste des niveaux, jeu, éditeur
let testMode = false; // partie lancée depuis l'éditeur (« Tester »)
let playCtx = null;    // partie d'un niveau perso : {kind: 'mine' (mes créations) | 'recus' (reçus d'amis), i}
// niveaux perso (créations du joueur, niveaux reçus) gardés sur l'appareil
const persoKey = k => k === 'mine' ? 'orbite-perso' : 'orbite-recus';
function persoList(k) { try { const a = JSON.parse(localStorage.getItem(persoKey(k)) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function persoSave(k, arr) { try { localStorage.setItem(persoKey(k), JSON.stringify(arr, (key, v) => key === '_B' || key === '_dyn' ? undefined : key === 'planets' && Array.isArray(v) ? v.filter(p => !p.frag) : v)); } catch (e) {} }
const levelTitle = () => playCtx ? (L.name || 'Niveau perso') : `Niveau ${lvl + 1}/${LV.length}`;
let shipKind = 'fusee', updState = ''; // vaisseau choisi ; état de la vérification des mises à jour
try { shipKind = localStorage.getItem('orbite-vaisseau') || 'fusee'; } catch (e) {}
// centre de gravité G de chaque vaisseau, le long de son axe : -1 = arrière, 0 = milieu (là où visent les jets), +1 = nez
const G_DEFAULT = 1; // par défaut : G au nez = rotation d'origine du jeu
let shipG = {};
try { shipG = JSON.parse(localStorage.getItem('orbite-g') || '{}') || {}; } catch (e) {}
const gOf = () => shipG[shipKind] ?? G_DEFAULT;
// redressement automatique (0 = aucun, comportement initial ; 1 = rapide) : l'arrière se tourne vers l'astre le plus proche, en consommant du gaz
const REDRESS_COST = 0.15; // gaz (secondes de pleine poussée) par radian tourné
let shipRed = {};
try { shipRed = JSON.parse(localStorage.getItem('orbite-redressement') || '{}') || {}; } catch (e) {}
const RED_DEFAULT = 0.15; // redressement par défaut tant que l'utilisateur n'a rien réglé
const redOf = () => shipRed[shipKind] ?? RED_DEFAULT;
let fixedNorth = false; // commande : vaisseau orienté comme en vol (boussole) ou toujours vers le nord (fixe)
try { fixedNorth = localStorage.getItem('orbite-commande') === 'fixe'; } catch (e) {}

try { lvl = Math.min(LV.length - 1, parseInt(localStorage.getItem('orbite-niveau') || '0', 10) || 0); } catch (e) {}
try { medals = JSON.parse(localStorage.getItem('orbite-medailles') || '{}') || {}; } catch (e) {}
// niveaux débloqués, gardés à part : un niveau modifié perd ses étoiles mais la suite reste ouverte
let opened = new Set();
try { (JSON.parse(localStorage.getItem('orbite-ouverts') || '[]') || []).forEach(i => opened.add(+i)); } catch (e) {}
function noteOpened() {
  Object.keys(medals).forEach(k => { if ((medals[k] || []).some(Boolean)) { opened.add(+k); opened.add(+k + 1); } });
  try { localStorage.setItem('orbite-ouverts', JSON.stringify([...opened])); } catch (e) {}
}
noteOpened(); // avant la vérification des niveaux modifiés

// astres pris en compte dans les empreintes : sans les morceaux nés en partie ni le réglage « détachable »
// (il ne joue qu'une fois le vaisseau écrasé : il ne change ni le parcours ni les étoiles)
const sigPlanets = l => l.planets.filter(p => !p.frag).map(p => { if (!p.loose && !p.core) return p; const { loose, core, ...q } = p; return q; });
// empreinte d'un niveau (tout ce qui change le jeu : astres, départ, objectifs, ceintures, gaz, chrono)
function levelSig(l) {
  const str = JSON.stringify([sigPlanets(l), l.start, l.steps, l.belts || null, l.fuel, l.time]);
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
// empreinte des étoiles : le parcours (astres, départ, objectifs, ceintures), puis le gaz et le chrono en clair,
// pour ne retirer que les étoiles dont l'objectif est devenu plus dur
function medalSig(l) {
  const str = JSON.stringify([sigPlanets(l), l.start, l.steps, l.belts || null]);
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36) + '~' + l.fuel + '~' + l.time;
}
// anciennes empreintes (un seul bloc, jusqu'à la v80) des niveaux retouchés en v81 : [empreinte, parcours, gaz, chrono] d'alors
const LEGACY_SIGS = { 20: ['1hkjt4m', '1az2acr', 2.8, 12], 27: ['olx6vj', 'ya1l2p', 3.8, 12], 29: ['pf82ej', '1xn6hcu', 6.3, 11], 33: ['1503dvk', '9tmogz', 10.8, 26], 34: ['vzwooa', 'tztnfq', 7.3, 44] };
function asMedalSig(i, sg) {
  if (!sg || sg.includes('~')) return sg;
  if (LV[i] && sg === levelSig(LV[i])) return medalSig(LV[i]); // niveau inchangé depuis
  const g = LEGACY_SIGS[i]; return g && g[0] === sg ? g[1] + '~' + g[2] + '~' + g[3] : null;
}
// étoiles gardées quand un niveau a changé : parcours différent → tout est à refaire ; sinon l'étoile gaz (ou chrono)
// reste si le nouvel objectif est égal ou plus large que celui qu'on a réussi
function keptMedals(i, oldSig, md) {
  const sg = asMedalSig(i, oldSig); if (!sg || !LV[i]) return null;
  const [g0, f0, t0] = sg.split('~'), [g1, f1, t1] = medalSig(LV[i]).split('~');
  if (g0 !== g1) return null;
  const r = [!!md[0], !!md[1] && +f1 >= +f0, !!md[2] && +t1 >= +t0];
  return r.some(Boolean) ? r : null;
}
// au démarrage : un niveau modifié depuis qu'on l'a joué ne perd que les étoiles dont l'objectif a changé
function checkModifiedLevels() {
  let sigs = {};
  try { sigs = JSON.parse(localStorage.getItem('orbite-empreintes') || '{}') || {}; } catch (e) {}
  const next = {};
  LV.forEach((l, i) => {
    const sg = medalSig(l);
    if (medals[i] && sigs[i] && sigs[i] !== sg) { const k = keptMedals(i, sigs[i], medals[i]); if (k) medals[i] = k; else delete medals[i]; }
    next[i] = sg;
  });
  Object.keys(medals).forEach(k => { if (!LV[k]) delete medals[k]; });
  try { localStorage.setItem('orbite-medailles', JSON.stringify(medals)); localStorage.setItem('orbite-empreintes', JSON.stringify(next)); } catch (e) {}
}
checkModifiedLevels();

// ===== Mise en page =====
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const cs = getComputedStyle(safeEl);
  safeTop = parseFloat(cs.paddingTop) || 0;
  safeBot = parseFloat(cs.paddingBottom) || 0;
  // le jeu occupe tout l'écran, bords compris ; les commandes se superposent en bas, collées au bord
  ctrl.r = Math.max(54, Math.min(72, W * 0.19));
  ctrl.x = W / 2; ctrl.y = H - Math.max(safeBot, 6) - ctrl.r - 4;
  bandTop = ctrl.y - ctrl.r - 30; // haut de la zone des commandes
  gameH = bandTop - safeTop;
  scale = baseScale = Math.min(W / WORLD_W, (H - safeTop) / WORLD_H);
  ox = baseOx = (W - WORLD_W * scale) / 2;
  baseOy = safeTop + (H - safeTop - WORLD_H * scale) / 2; // la vue montre toujours 2000 m de haut
  oy = baseOy - camY * scale;
  homeTex = paintBody({ type: 'terre' }, Math.min(W * 0.75, 340) * dpr, 4242);
  bgStars = [];
  for (let i = 0; i < 160; i++) bgStars.push({ x: Math.random() * W, y: Math.random() * H, a: 0.15 + Math.random() * 0.45, s: Math.random() < 0.15 ? 1.6 : 1 });
  if (L) buildTextures();
  if (screen === 'editor') editorLayout();
}

// ===== Astres réalistes (textures procédurales) =====
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// couleur hexadécimale éclaircie (k > 0) ou assombrie (k < 0)
function shade(hex, k) {
  const n = parseInt((hex || '#888888').slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k))));
  return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`;
}
// couleur d'une étoile selon sa température (temp 0 → 1) : géante rouge, orange, jaune (Soleil), blanche, naine blanche bleutée
const STAR_STOPS = [[0, [255, 90, 60]], [0.25, [255, 150, 70]], [0.5, [255, 205, 100]], [0.75, [250, 248, 255]], [1, [170, 205, 255]]];
const STAR_NAMES = ['Géante rouge', 'Orange', 'Jaune', 'Blanche', 'Naine blanche'];
function starRGB(p) {
  const t = Math.max(0, Math.min(1, p.temp ?? 0.5));
  for (let i = 1; i < STAR_STOPS.length; i++) if (t <= STAR_STOPS[i][0]) {
    const [t0, a] = STAR_STOPS[i - 1], [t1, b] = STAR_STOPS[i], k = (t - t0) / (t1 - t0);
    return a.map((v, j) => Math.round(v + (b[j] - v) * k));
  }
  return STAR_STOPS[4][1];
}
const starName = p => STAR_NAMES[Math.round(Math.max(0, Math.min(1, p.temp ?? 0.5)) * 4)];
const starLum = p => p.lum ?? 1;
const starWeight = b => { const p = L.planets[b.i]; return b.r * b.r * starLum(p); }; // part de lumière : taille × intensité
const rgbOf = hex => { const n = parseInt((hex || '#888888').slice(1), 16); return `${n >> 16},${n >> 8 & 255},${n & 255}`; };

function paintBody(p, R, seed) {
  const type = p.type;
  const S = Math.max(8, Math.ceil(R * 2)), c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d'), m = S / 2, rnd = rng(seed);
  g.beginPath(); g.arc(m, m, m, 0, Math.PI * 2); g.clip();
  const fill = col => { g.fillStyle = col; g.fillRect(0, 0, S, S); };
  const blob = (x, y, rad, col, n) => {
    g.fillStyle = col;
    for (let i = 0; i < n; i++) { const a = rnd() * Math.PI * 2, d = rnd() * rad; g.beginPath(); g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, rad * (0.25 + rnd() * 0.45), 0, Math.PI * 2); g.fill(); }
  };
  const craters = (n, dark, light, maxR) => {
    for (let i = 0; i < n; i++) {
      const x = rnd() * S, y = rnd() * S, rad = S * (0.02 + rnd() * maxR);
      g.fillStyle = dark; g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
      g.strokeStyle = light; g.lineWidth = Math.max(0.5, rad * 0.3);
      g.beginPath(); g.arc(x, y, rad, Math.PI * 0.1, Math.PI * 1.1); g.stroke();
    }
  };
  const bands = (cols, alpha) => {
    let y = 0;
    while (y < S) {
      const h = S * (0.04 + rnd() * 0.1);
      g.globalAlpha = alpha; g.fillStyle = cols[Math.floor(rnd() * cols.length)];
      g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= S; x += S / 12) g.lineTo(x, y + Math.sin(x / S * 9 + y) * S * 0.012);
      for (let x = S; x >= 0; x -= S / 12) g.lineTo(x, y + h + Math.sin(x / S * 7 + y * 2) * S * 0.012);
      g.fill(); y += h;
    }
    g.globalAlpha = 1;
  };
  const ellipses = (n, col, alpha, w, h) => {
    g.fillStyle = col;
    for (let i = 0; i < n; i++) { g.globalAlpha = alpha * (0.5 + rnd() * 0.5); g.beginPath(); g.ellipse(rnd() * S, rnd() * S, S * w * (0.5 + rnd()), S * h * (0.5 + rnd()), rnd() * 0.6 - 0.3, 0, Math.PI * 2); g.fill(); }
    g.globalAlpha = 1;
  };
  switch (type) {
    case 'terre':
      fill('#1f5fae');
      for (let i = 0; i < 6; i++) blob(rnd() * S, S * (0.2 + rnd() * 0.6), S * (0.1 + rnd() * 0.12), i % 3 ? '#3d7f3b' : '#8c7b4c', 14);
      ellipses(20, '#ffffff', 0.55, 0.12, 0.025);
      g.fillStyle = '#f4f8ff'; g.beginPath(); g.ellipse(m, 0, S * 0.35, S * 0.1, 0, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(m, S, S * 0.4, S * 0.1, 0, 0, Math.PI * 2); g.fill();
      break;
    case 'lune':
      fill('#a9a9a4');
      for (let i = 0; i < 5; i++) blob(rnd() * S, rnd() * S, S * (0.08 + rnd() * 0.1), '#80807b', 10);
      craters(16, 'rgba(90,90,86,0.55)', 'rgba(220,220,214,0.5)', 0.06);
      break;
    case 'mercure':
      fill('#8f847a');
      craters(24, 'rgba(100,90,82,0.6)', 'rgba(190,180,170,0.5)', 0.06);
      break;
    case 'mars':
      fill('#c25a30');
      for (let i = 0; i < 5; i++) blob(rnd() * S, rnd() * S, S * (0.08 + rnd() * 0.12), 'rgba(110,45,20,0.55)', 12);
      craters(8, 'rgba(140,60,30,0.6)', 'rgba(230,140,100,0.4)', 0.04);
      g.fillStyle = '#fbf3ee'; g.beginPath(); g.ellipse(m, 0, S * 0.25, S * 0.07, 0, 0, Math.PI * 2); g.fill();
      break;
    case 'venus':
      fill('#e3c58a');
      bands(['#f2deb0', '#d2ab68', '#e8cf98'], 0.5);
      ellipses(14, '#fff3d2', 0.35, 0.18, 0.03);
      break;
    case 'jupiter':
      fill('#d8bf98');
      bands(['#e8d8bb', '#b8885c', '#f1e7d3', '#a5714a', '#d9b58a', '#c4956a'], 1);
      g.fillStyle = '#b5523a'; g.beginPath(); g.ellipse(S * 0.62, S * 0.64, S * 0.13, S * 0.07, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(240,220,200,0.6)'; g.lineWidth = Math.max(1, S * 0.01); g.stroke();
      break;
    case 'saturne':
      fill('#e2cc95');
      bands(['#efdcae', '#d4b980', '#f4e7c3', '#c9aa70'], 1);
      break;
    case 'uranus':
      fill('#9fdce2');
      bands(['#b4e8ec', '#94d3da', '#a9e2e7'], 0.35);
      break;
    case 'neptune':
      fill('#3b6ee0');
      bands(['#2e57c2', '#4f82ee', '#3563d4'], 0.5);
      g.fillStyle = '#1b3480'; g.beginPath(); g.ellipse(S * 0.38, S * 0.6, S * 0.1, S * 0.055, 0, 0, Math.PI * 2); g.fill();
      ellipses(6, '#e8f0ff', 0.5, 0.06, 0.012);
      break;
    case 'soleil': {
      const gr = g.createRadialGradient(m, m, 0, m, m, m);
      if (p.temp === undefined) { gr.addColorStop(0, '#fffbe8'); gr.addColorStop(0.5, '#ffe27e'); gr.addColorStop(0.85, '#ffb22e'); gr.addColorStop(1, '#ff8a1a'); }
      else { // étoile colorée : cœur presque blanc, bord plus soutenu
        const [r, gg, bb] = starRGB(p), mix = (k, d) => `rgb(${[r, gg, bb].map(v => Math.round(Math.max(0, Math.min(255, k > 0 ? v + (255 - v) * k : v * (1 + k))))).join(',')})`;
        gr.addColorStop(0, mix(0.85)); gr.addColorStop(0.5, mix(0.35)); gr.addColorStop(0.85, mix(0)); gr.addColorStop(1, mix(-0.2));
      }
      g.fillStyle = gr; g.fillRect(0, 0, S, S);
      g.fillStyle = 'rgba(255,240,170,0.18)';
      for (let i = 0; i < 260; i++) { g.beginPath(); g.arc(rnd() * S, rnd() * S, S * 0.008 + rnd() * S * 0.01, 0, Math.PI * 2); g.fill(); }
      break;
    }
    case 'perso': { // planète personnalisée : couleur de base + aspect
      const c = p.color || '#8a7fd0', st = p.style || 'roche';
      fill(c);
      if (st === 'gaz') bands([shade(c, 0.25), shade(c, -0.2), shade(c, 0.1), shade(c, -0.35)], 0.9);
      else if (st === 'ocean') { for (let i = 0; i < 6; i++) blob(rnd() * S, S * (0.2 + rnd() * 0.6), S * (0.1 + rnd() * 0.12), shade(c, i % 2 ? -0.45 : 0.35), 14); ellipses(16, '#ffffff', 0.5, 0.12, 0.025); }
      else if (st === 'glace') { fill(shade(c, 0.55)); g.strokeStyle = shade(c, -0.2); g.lineWidth = Math.max(1, S * 0.006); for (let i = 0; i < 14; i++) { g.beginPath(); g.moveTo(rnd() * S, rnd() * S); for (let k = 0; k < 4; k++) g.lineTo(rnd() * S, rnd() * S); g.stroke(); } }
      else { for (let i = 0; i < 5; i++) blob(rnd() * S, rnd() * S, S * (0.08 + rnd() * 0.1), shade(c, -0.3), 10); craters(16, shade(c, -0.4), shade(c, 0.4), 0.05); }
      break;
    }
    default: fill('#888');
  }
  // teinte personnalisée : recolore la planète en gardant son relief (nuance = intensité)
  if (p.tint && type !== 'soleil') {
    g.globalCompositeOperation = 'color'; g.globalAlpha = p.shade ?? 0.6;
    g.fillStyle = p.tint; g.fillRect(0, 0, S, S);
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  }
  // relief sphérique
  if (type !== 'soleil') {
    const sh = g.createRadialGradient(m * 0.8, m * 0.8, m * 0.1, m, m, m);
    sh.addColorStop(0, 'rgba(255,255,255,0.08)'); sh.addColorStop(0.75, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.3)');
    g.fillStyle = sh; g.fillRect(0, 0, S, S);
  }
  return c;
}

function buildTextures() {
  textures = L.planets.map((p, i) => paintBody(p, p.r * scale * dpr, lvl * 97 + i * 13 + 7));
  bodyRGB = [];
}
// couleur moyenne d'un astre (poussière au sol, débris d'explosion)
let bodyRGB = [];
function bodyColor(i) {
  if (bodyRGB[i]) return bodyRGB[i];
  const p = L.planets[i];
  if (p && p.star) return (bodyRGB[i] = starRGB(p).join(','));
  const c = document.createElement('canvas'); c.width = c.height = 4;
  const g = c.getContext('2d'); if (textures[i]) g.drawImage(textures[i], 0, 0, 4, 4);
  const d = g.getImageData(0, 0, 4, 4).data; let r = 0, gg = 0, bb = 0, n = 0;
  for (let k = 0; k < d.length; k += 4) if (d[k + 3] > 100) { r += d[k]; gg += d[k + 1]; bb += d[k + 2]; n++; }
  return (bodyRGB[i] = n ? [r, gg, bb].map(v => Math.round(v / n)).join(',') : '150,150,150');
}

// anneaux décoratifs (Saturne par défaut, ou toute planète avec ring = couleur) : moitié arrière avant la planète, moitié avant après

}

// ===== Simulation (appui dans le vide) et aide =====
// Recherche découpée en tranches : retient la solution au meilleur compromis temps / gaz
// pts : simulation du joueur : route vers le(s) point(s) au moins de gaz possible
function search(pts, budget, done) {
  const job = { cancel: false, progress: 0 }, LS = L; // calcul complet : astres en mouvement et ombres, pour une route sûre
  if (pts) budget = Math.max(budget, 600);
  let best = null, n = 0;
  const slice = () => {
    if (job.cancel) return;
    const t0 = performance.now();
    while (performance.now() - t0 < 25 && n < budget) {
      const P = best && n > budget / 3 ? mutate(best.P, Math.random, n > budget * 0.7 ? 0.4 : 1, worldH(L)) : randP(L, !pts);
      const r = fly(LS, P, pts);
      if (r.ok) { const c = pts ? r.used + 0.01 * r.t : ratioCost(L, r); if (!best || c < best.c) best = { P, c, used: r.used, path: r.path, end: r.end }; }
      n++;
    }
    job.progress = n / budget;
    if (n < budget) setTimeout(slice, 0); else done(best);
  };
  setTimeout(slice, 0);
  return job;
}

// suite de la route après le point visé, sans rien révéler : elle traverse les astres comme s'ils n'existaient pas (ni croix, ni arrêt)
function freeCoast(o) {
  let x = o.x, y = o.y, vx = o.vx, vy = o.vy;
  const h = 1 / 120, path = [[x, y]], t0 = o.tw || 0, hh = worldH(L);
  for (let i = 1; i <= 1200; i++) {
    const Bt = snapshot(L, t0 + i * h);
    let ax = 0, ay = 0;
    for (const b of Bt) { const dx = b.x - x, dy = b.y - y, d2 = Math.max(dx * dx + dy * dy, b.r * b.r), d = Math.sqrt(d2), g = b.m / d2; ax += g * dx / d; ay += g * dy / d; } // adoucie dans l'astre
    vx += ax * h; vy += ay * h; x += vx * h; y += vy * h;
    if (i % 6 === 0) path.push([x, y]);
    if (x < -OUT_MARGIN || x > WORLD_W + OUT_MARGIN || y < -OUT_MARGIN || y > hh + OUT_MARGIN) break;
  }
  return { path, hit: null };
}
function runPlan() {
  if (planJob) planJob.cancel = true;
  plan = null;
  planJob = search(taps.slice(), 300, best => { plan = best ? { P: best.P, used: best.used, path: best.path, coast: freeCoast(best.end) } : { fail: true }; planJob = null; });
}

function runHelp() {
  if (helpRes || helpJob) return;
  // niveau reçu d'un ami : pas de solveur, seulement la solution s'il l'a envoyée
  if (playCtx && playCtx.kind === 'recus' && !L.hint) { helpRes = { fail: true, locked: true }; return; }
  if (L.hint) {
    const r = fly(L, L.hint, null);
    if (r.ok) { helpRes = { used: r.used, path: r.path }; return; }

}

// point de simulation en coordonnées monde (tout l'écran de jeu)
const simPoint = (cx, cy) => [(cx - ox) / scale, (cy - oy) / scale];
const planetAt = (cx, cy) => {
  const wx = (cx - ox) / scale, wy = (cy - oy) / scale;
  return B.findIndex(p => Math.hypot(wx - p.x, wy - p.y) < p.r + 20 / scale);
};

// ===== Commande =====
// clavier (PC) : flèches, ZQSD ou WASD = poussée dans la direction de la touche (diagonales possibles)
const keys = new Set();
const KEY_DIR = { arrowup: [0, -1], z: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], q: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
function keyThrust() {
  let x = 0, y = 0;
  for (const k of keys) { const v = KEY_DIR[k]; if (v) { x += v[0]; y += v[1]; } }
  const d = Math.hypot(x, y);
  return d ? { x: x / d, y: y / d, p: 1 } : null;
}

// mode fixe : la commande est dans le repère du vaisseau (son nez = le haut du cercle)
const toShip = (v, sgn) => {
  const a = sgn * (ship.ang + Math.PI / 2), c = Math.cos(a), s = Math.sin(a);
  return { x: v.x * c - v.y * s, y: v.x * s + v.y * c, p: v.p };
};
// un doigt → un jet, dans le repère de la commande (haut du cercle = haut de l'écran, ou nez du vaisseau en mode fixe)
function fingerJet(t) {
  const dx = t.x - ctrl.x, dy = t.y - ctrl.y, d = Math.hypot(dx, dy);
  if (d < ctrl.r * 0.12) return null;
  // doigt à droite → gaz éjecté à droite → poussée vers la gauche
  const v = { x: -dx / d, y: -dy / d, p: Math.min(1, d / ctrl.r) };
  if (!fixedNorth) return v;
  // mode fixe : 4 directions seulement (avant, arrière, gauche, droite), la puissance est conservée
  return Math.abs(v.x) >= Math.abs(v.y) ? { x: Math.sign(v.x), y: 0, p: v.p } : { x: 0, y: Math.sign(v.y), p: v.p };
}
const ctrlJets = () => [...touches.values()].map(fingerJet).filter(Boolean);
// poussée totale : somme des jets ; chaque jet consomme son propre gaz (fuel = somme des puissances)
function thrustInput() {
  if (state !== 'play') return null;
  let jets = ctrlJets();
  if (!touches.size && keys.size) { const k = keyThrust(); jets = k ? [fixedNorth ? (Math.abs(k.x) >= Math.abs(k.y) ? { x: Math.sign(k.x), y: 0, p: 1 } : { x: 0, y: Math.sign(k.y), p: 1 }) : k] : []; }
  if (!jets.length) return null;
  const w = jets.map(v => fixedNorth ? toShip(v, 1) : v);
  let sx = 0, sy = 0, f = 0;
  for (const v of w) { sx += v.x * v.p; sy += v.y * v.p; f += v.p; }
  const m = Math.sqrt(sx * sx + sy * sy);
  return m > 1e-6 ? { x: sx / m, y: sy / m, p: m, fuel: f, jets: w } : { x: 0, y: 0, p: 0, fuel: f, jets: w };
}

// effacer la progression du joueur (étoiles, dernier niveau) ; le vaisseau choisi est conservé
// ===== Sauvegarde : code « message extraterrestre » (impossible à retoucher à la main : il est signé) =====
const ALIEN = '⊕⊖⊗⊘⊙⊚⊛⊜⊝⊞⊟⊠⊡⋄⋇⋈⋉⋊⋋⋌⌬⌭⌮⌯⌰⌱⌲⌳⌴⌵⍜⍝⍟⍦⍧⍨⍫⍬⍭⍱⍲⍼⎈⎉⎊⎋⎌⏀⏁⏂⏃⏄⏅⏆⏇⏈⏉⏊⏋⏌⟟⟒⟊⟁';
const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
const alienOf = {}, b64Of = {};
[...ALIEN].forEach((g, i) => { alienOf[B64[i]] = g; b64Of[g] = B64[i]; });
const fnv = str => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };

function alienPack(obj, head = '👽', tail = '🛸') {
  const data = JSON.stringify(obj), b = btoa(unescape(encodeURIComponent(data))).replace(/=+$/, ''), h = fnv(data);
  const chk = Array.from({ length: 6 }, (_, k) => B64[(h >>> (k * 5)) & 63]).join('');
  const glyphs = [...(b + chk)].map(c => alienOf[c]).join('');
  return head + ' ' + glyphs.match(/.{1,5}/gu).join(' ') + ' ' + tail;
}
function alienUnpack(txt) {
  const raw = [...(txt || '')].filter(g => b64Of[g] !== undefined).map(g => b64Of[g]).join('');
  if (raw.length < 10) return null;
  const b = raw.slice(0, -6), chk = raw.slice(-6);
  let data; try { data = decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4)))); } catch (e) { return null; }
  const h = fnv(data);
  if (Array.from({ length: 6 }, (_, k) => B64[(h >>> (k * 5)) & 63]).join('') !== chk) return null; // signature fausse : message retouché
  try { return JSON.parse(data); } catch (e) { return null; }
}
function progressCode() {
  const m = LV.map((_, i) => { const md = medals[i] || []; return (md[0] ? 1 : 0) + (md[1] ? 2 : 0) + (md[2] ? 4 : 0); }).join('');
  return alienPack({ v: 1, m, s: LV.map((l, i) => medals[i] ? medalSig(l) : ''), o: [...opened], n: lvl, k: shipKind });
}
function readProgressCode(txt) {

}
function applyProgress(o) {

  [...o.m].forEach((c, i) => { const v = +c; if (!LV[i] || !v) return; const md = [!!(v & 1), !!(v & 2), !!(v & 4)]; opened.add(i); opened.add(i + 1); if (!o.s || o.s[i] === medalSig(LV[i])) medals[i] = md; else { const k = keptMedals(i, o.s[i], md); if (k) medals[i] = k; } }); // niveau modifié depuis : seules les étoiles devenues plus dures sont à refaire, la suite reste ouverte
  lvl = Math.max(0, Math.min(LV.length - 1, o.n | 0));

  try {
    localStorage.setItem('orbite-medailles', JSON.stringify(medals)); localStorage.setItem('orbite-ouverts', JSON.stringify([...opened]));
    localStorage.setItem('orbite-niveau', String(lvl)); localStorage.setItem('orbite-vaisseau', shipKind);
    localStorage.setItem('orbite-empreintes', JSON.stringify(Object.fromEntries(LV.map((l, i) => [i, medalSig(l)]))));
  } catch (e) {}

// vérifier les mises à jour sans réinstaller l'appli : télécharge la nouvelle version puis recharge
async function checkUpdate() {
  if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost')) { updState = 'Indisponible ici (appli non installée)'; return; }
  updState = 'Recherche…';
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) { updState = 'Indisponible'; return; }
    await reg.update();
    const nw = reg.installing || reg.waiting;
    if (!nw) { updState = 'Tu as la dernière version'; return; }
    updState = 'Installation de la mise à jour…';
    nw.addEventListener('statechange', () => { if (nw.state === 'activated') location.reload(); });
    nw.postMessage('skipWaiting');
  } catch (e) { updState = 'Vérification impossible (hors ligne ?)'; }
}

// rotation par le joueur : les jets visent le milieu du vaisseau ; l'écart avec G crée le couple
// G vers le nez → le nez se tourne vers la poussée ; G au milieu → aucune rotation ; G vers l'arrière → la queue se tourne vers la poussée
function turnG(s, th, dt) {
  const k = gOf();
  if (k >= 1) { turn(s, th, dt); return; } // G au nez : exactement le comportement initial
  const nx = Math.cos(s.ang), ny = Math.sin(s.ang);
  const cr = nx * th.y - ny * th.x, d = Math.atan2(cr, nx * th.x + ny * th.y);
  let w = TURN_RATE * k * th.p * cr * dt;
  if (k > 0 && Math.abs(w) > Math.abs(d)) w = d; // sans dépasser l'alignement
  s.ang += w;

const shipBox = {};
function measureShip(kind) {

// point du dessin du vaisseau (unités de dessin, −y = nez) → monde
function shipPoint(dx, dy) {
  const unit = Math.max(1, 1.15 / scale), off = HULL_R - 8.6 * unit, nx = Math.cos(ship.ang), ny = Math.sin(ship.ang);

  const lx = ex * -ny + ey * nx, ly = -(ex * nx + ey * ny), gy = (k.t + k.b) / 2; // visuel : comme si G était au centre du dessin

// ===== Physique : pas fixe identique à la simulation =====
function tick() {
  if (state !== 'play') { // fin de partie : le temps continue (astres, lunes, vaisseau posé), rien ne se commande
    const h = DT / SUB;
    if (!ship.dead) for (let k = 0; k < SUB; k++) { // le vaisseau reste destructible (le résultat obtenu ne change pas)
      const r = physStep(launched ? snapshot(L, wt + k * h) : B, ship, null, h);
      if (r.crash) { boom(r.crash === 'belt' ? -1 : (r.p ?? -1), r.crash); break; }
    }
    if (launched && L._dyn) stepDyn(DT);
    if (launched) wt += DT;
    B = snapshot(L, wt);
    return;
  }
  const B0 = snapshot(L, wt);
  let th = thrustInput();
  const byPlayer = !!th;
  if (th) auto = null; // le joueur reprend la main
  else if (auto) {
    // même logique que fly() : points de passage dans l'ordre, arrêt au dernier
    const ap = auto.pts;
    if (hyp(ap[auto.i][0] - ship.x, ap[auto.i][1] - ship.y) < 30 && ++auto.i >= ap.length) auto = null; // objectif de la simulation atteint
    else th = steer(B0, ship, ap[auto.i][0], ap[auto.i][1], auto.i < ap.length - 1 ? auto.P.vmax : 0, auto.P);
  }
  if (fuel <= 0) th = null;
  shadowNow = inShadow(B0, ship.x, ship.y);
  if (shadowNow) th = null; // dans l'ombre : commandes coupées
  curTh = th;
  if (th && !departed) depart();
  if (th) launched = true; // le chrono et les lunes démarrent au premier jet
  if (th && th.p > 0) { if (byPlayer) turnG(ship, th, DT); else turn(ship, th, DT); } // le pilote auto garde la rotation du solveur
  // redressement automatique (réglage du vaisseau) : en vol, sans poussée du joueur ni pilote auto ; consomme du gaz
  const red = redOf();
  if (red > 0 && departed && !byPlayer && !auto && !shadowNow && fuel > 0 && ship.airT > 0) {
    // seulement si la trajectoire prévue (celle tracée devant le vaisseau) va toucher un astre : on se redresse vers lui ; en orbite, rien
    const tb = predHit >= 0 && B0[predHit] && !B0[predHit].star ? B0[predHit] : null;
    if (tb) {
      let d = Math.atan2(ship.y - tb.y, ship.x - tb.x) - ship.ang; d = Math.atan2(Math.sin(d), Math.cos(d)); // nez à l'opposé de l'astre
      const m = TURN_RATE * red * DT, w = Math.max(-m, Math.min(m, d));
      ship.ang += w; fuel = Math.max(0, fuel - REDRESS_COST * Math.abs(w));
      // visuel seulement : petits coups de gaz bleutés, saccadés, au nez et à la queue (couple de rotation)
      if (Math.abs(w) > 1e-4 && Math.floor(performance.now() / 110) % 2 === 0) redressFx = { sg: Math.sign(w), t: performance.now() }; // repris sur la commande
      if (Math.abs(w) > 1e-4 && Math.floor(performance.now() / 110) % 2 === 0 && Math.random() < 0.35 + 0.65 * Math.abs(w) / m) {
        const k = measureShip(shipKind), sg = Math.sign(w), sx = -Math.sin(ship.ang) * sg, sy = Math.cos(ship.ang) * sg; // sens où part le nez
        const hw = 0.75 * (k.r - k.l) / 2; // bord du corps
        for (const [dy, e] of [[k.t + (k.b - k.t) * 0.18, -1], [k.b - (k.b - k.t) * 0.18, 1]]) {
          const o = shipPoint(-e * sg * hw, dy);
          for (let n = 0; n < 2; n++) {
            const v = 35 + Math.random() * 35, sp = 0.3 - Math.random() * 0.6;
            const ex = e * sx, ey = e * sy, cx = ex * Math.cos(sp) - ey * Math.sin(sp), cy = ex * Math.sin(sp) + ey * Math.cos(sp);
            particles.push({ x: o.x, y: o.y, vx: ship.vx + cx * v, vy: ship.vy + cy * v, life: 0.18 + Math.random() * 0.17, max: 0.35, rgb: '170,215,255', sz: 1 });
          }
        }
      }
    }
  }
  if (th) for (const jt of th.jets || [th]) {
    const n = Math.ceil(2 * jt.p);
    for (let i = 0; i < n; i++) {
      const sp = (0.35 - Math.random() * 0.7), ex = -jt.x, ey = -jt.y;
      const cx = ex * Math.cos(sp) - ey * Math.sin(sp), cy = ex * Math.sin(sp) + ey * Math.cos(sp), v = 90 + Math.random() * 90 * jt.p;
      const o = jetOrigin(ex, ey);
      particles.push({ x: o.x, y: o.y, vx: ship.vx + cx * v, vy: ship.vy + cy * v, life: 0.25 + Math.random() * 0.3, max: 0.55 });
    }
  }
  // vol enregistré (éditeur, « piloter moi-même ») : valeurs arrondies appliquées telles quelles, pour un rejeu identique
  if (recMode) {
    const q = v => Math.round(v * 1e4) / 1e4;
    if (th) th = { x: q(th.x), y: q(th.y), p: q(th.p), fuel: q(th.fuel ?? th.p), jets: th.jets };
    ship.ang = q(ship.ang);
    const fr = th ? [th.x, th.y, th.p, th.fuel, ship.ang] : [ship.ang], last = recMode.runs[recMode.runs.length - 1];
    if (last && last.length === fr.length + 1 && fr.every((v, k) => v === last[k + 1])) last[0]++; else recMode.runs.push([1, ...fr]);
  }
  const h = DT / SUB;
  let landedOn = -1, landed = false;
  for (let k = 0; k < SUB; k++) {
    if (th) fuel = Math.max(0, fuel - h * (th.fuel ?? th.p));
    const r = physStep(launched ? snapshot(L, wt + k * h) : B0, ship, th, h);
    if (r.crash) { lose(r.crash, r.p ?? -1); return; }
    if (r.contact >= 0) { landed = true; if (r.wasAir > 0.5) landedOn = r.contact; }
    if (outOfBounds(ship, worldH(L))) { lose('out'); return; }
  }
  if (launched && L._dyn) stepDyn(DT);
  if (launched) wt += DT;
  elapsed = wt;
  B = snapshot(L, wt);
  // traversée d'anneaux : des poussières s'en échappent (sans effet sur le vaisseau)
  for (const b of B) {
    const p = L.planets[b.i];
    if (hasRings(p) && !(L._dyn && L._dyn.ringFree && L._dyn.ringFree[b.i]) && inRings(p, b.x, b.y, ship.x, ship.y)) breakRings(p, b.i, b.x, b.y);
  }
  missionTick(L, B, mission, ship, DT, landedOn);
  if (mission.done) { win(); return; }
  if (landed && (fuel <= 0 || shadowNow) && Math.hypot(ship.vx, ship.vy) < 2) {
    idleT += DT;
    if (idleT > 1.5) {
      if (fuel <= 0) lose('fuel');
      else { // dans l'ombre : on attend si un astre en mouvement doit laisser repasser la lumière ; sinon c'est perdu
        if (waitLight === null) waitLight = lightReturns();
        if (!waitLight) lose('shadow');
      }
    }
  } else { idleT = 0; waitLight = null; }
}

// la lumière reviendra-t-elle sur le vaisseau posé ? (astres en mouvement, sur les 2 prochaines minutes)
let waitLight = null, redressFx = { sg: 1, t: -1e9 }, flashes = []; // flashes : éclair bref au point d'impact
function lightReturns() {
  if (!hasMoons(L)) return false;
  let j = 0, bd = Infinity;
  for (const b of B) { const d = hyp(ship.x - b.x, ship.y - b.y) - b.r; if (d < bd) { bd = d; j = b.i; } }
  const rx = ship.x - B[j].x, ry = ship.y - B[j].y; // le vaisseau suit l'astre sur lequel il est posé
  for (let k = 1; k <= 480; k++) { const Bt = snapshot(L, wt + k * 0.25), q = Bt[j]; if (!inShadow(Bt, q.x + rx, q.y + ry)) return true; }
  return false;
}

// image du vaisseau en pixels (unités de dessin), mesurée une fois par modèle : [dx, dy, "r,g,b"]
const shipPixels = {};
function shipPixelsOf(kind) {
  if (shipPixels[kind]) return shipPixels[kind];
  const S = 2, CW = 80, CH = 100, c = document.createElement('canvas'); c.width = CW; c.height = CH;
  const main = ctx; ctx = c.getContext('2d', { willReadFrequently: true });
  drawShip(kind, CW / 2, CH / 2, -Math.PI / 2, S, false, false);
  const im = ctx.getImageData(0, 0, CW, CH).data; ctx = main;
  const out = [];

// choc sur une surface en fusion : la lave est repoussée en bourrelets de part et d'autre (vagues)
function lavaKick(i, cut) {

  (D.lava = D.lava || {})[i] = 1; const hv = (D.hv = D.hv || {})[i] || (D.hv[i] = new Array(PROF_N).fill(0));

// épave intacte : vol libre sous la gravité, en tournant ; au premier contact avec un astre ou un caillou, elle se désagrège à son tour
function moveWrecks(fdt) {
  if (!B || screen !== 'game') return;
  for (const w of wrecks) {
    const [ax, ay] = gravity(B, w.x, w.y); w.vx += ax * fdt; w.vy += ay * fdt; w.x += w.vx * fdt; w.y += w.vy * fdt; w.ang += w.w * fdt;

    let hb = null, hx = 0, hy = 0;
    for (const b of rk ? [...B, rk] : B) {
      if (b.gone || hyp(w.x - b.x, w.y - b.y) > b.r + w.rc) continue;
      for (const [lx, ly] of w.pix) { const x = w.x + lx * c - ly * s, y = w.y + lx * s + ly * c; if (hyp(x - b.x, y - b.y) < surfR(b, x - b.x, y - b.y) - 0.3) { hb = b; hx = x; hy = y; break; } }

}

// caméra des « grands voyages » : la vue (2000 m) suit le vaisseau ; à l'arrivée, balayage de la carte du haut vers le bas
const SWEEP = 3.2;
let sweepT = -1e9, camLast = 0;
const camTarget = () => Math.max(0, Math.min(worldH(L) - WORLD_H, ship.y - WORLD_H * 0.6));
function updateCam() {
  const now = performance.now(), dt = Math.min(0.1, (now - camLast) / 1000); camLast = now;
  if (worldH(L) <= WORLD_H) camY = 0;
  else {
    const a = (now - sweepT) / 1000 / SWEEP;
    if (a < 1) { const e = a < 0.15 ? 0 : (a - 0.15) / 0.85, k = e * e * (3 - 2 * e); camY = camTarget() * k; } // un temps en haut, puis descente douce
    else camY += (camTarget() - camY) * Math.min(1, dt * 4);
  }
  // zoom / déplacement à deux doigts (avant le lancement, et une fois le niveau terminé : la vue choisie reste figée) ;
  // au décollage, la vue revient doucement à la normale
  if (departed && state === 'play' && (view.z !== 1 || view.px || view.py)) {
    const k = Math.min(1, dt * 5);
    view.z += (1 - view.z) * k; view.px -= view.px * k; view.py -= view.py * k;
    if (Math.abs(view.z - 1) < 0.002 && Math.abs(view.px) < 0.5 && Math.abs(view.py) < 0.5) { view.z = 1; view.px = view.py = 0; buildTextures(); }
  }
  scale = baseScale * view.z; ox = baseOx * view.z + view.px; oy = (baseOy - camY * baseScale) * view.z + view.py;
}

// vue avant le lancement : zoom (1 à 4) et déplacement à deux doigts
let view = { z: 1, px: 0, py: 0 }, pinch = null, tapUndo = null, endTap = null, endHide = false, endVis = 1, endVisT = 0;
const gamePtrs = new Map();
function pinchStart() {
  const [a, b] = [...gamePtrs.values()], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, wx: (mx - ox) / scale, wy: (my - oy) / scale, z: view.z };
}
function pinchMove() {
  const [a, b] = [...gamePtrs.values()], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const z = Math.max(1, Math.min(4, pinch.z * (Math.hypot(a.x - b.x, a.y - b.y) || 1) / pinch.d));
  view.z = z; // le point du monde pris entre les doigts reste sous les doigts
  view.px = mx - baseOx * z - pinch.wx * baseScale * z;
  view.py = my - (baseOy - camY * baseScale) * z - pinch.wy * baseScale * z;
  const lim = W * z; view.px = Math.max(-lim, Math.min(lim, view.px)); view.py = Math.max(-H * z, Math.min(H * z, view.py));
}

function draw() {
  if (screen === 'game') updateCam();
  if (screen === 'editor') { editorDraw(); return; }
  if (screen === 'perso' || screen === 'tuto') { drawBackdrop(); return; }
  if (screen === 'home') { drawHome(); return; }
  if (screen === 'levels') { drawLevels(); return; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  // zone de jeu
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  for (const s of bgStars) { ctx.fillStyle = `rgba(255,255,255,${s.a})`; ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.translate(ox, oy); ctx.scale(scale, scale);
  const lw = 1.5 / scale, t = performance.now() / 1000;

  drawLight(B);

  // astre sélectionné : zone de gravité et orbite conseillée
  if (selPlanet >= 0) {
    const p = B[selPlanet], o = influence(B, selPlanet);
    const gr = ctx.createRadialGradient(p.x, p.y, p.r, p.x, p.y, o.soi);
    gr.addColorStop(0, 'rgba(255,255,255,0.22)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(p.x, p.y, o.soi, 0, Math.PI * 2); ctx.fill();

      ctx.beginPath(); ctx.arc(p.x, p.y, o.rorb, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  // zones à atteindre : fin pointillé ; elles s'effacent avec l'interface à la fin de la partie
  const zoneA = state === 'play' ? 1 : Math.max(0, 1 - stateT / 0.6);
  if (zoneA > 0) L.steps.forEach((st, i) => {
    if (i < mission.step || st.type !== 'zone') return;
    const cur = i === mission.step;
    ctx.strokeStyle = `rgba(255,255,255,${(cur ? 0.9 : 0.4) * zoneA})`; ctx.lineWidth = 1 / scale;
    ctx.setLineDash([2 / scale, 5 / scale]); ctx.lineDashOffset = cur ? -t * 10 / scale : 0;

    ctx.setLineDash([]); ctx.lineDashOffset = 0;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (cur && mission.zoneT > 0) {
      ctx.lineWidth = 4 / scale;
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * mission.zoneT / ZONE_TIME); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = `600 ${16 / scale}px ${FONT}`;
      ctx.fillText(Math.ceil(ZONE_TIME - mission.zoneT) + ' s', st.x, st.y);
    } else {
      ctx.font = `600 ${14 / scale}px ${FONT}`; ctx.fillStyle = `rgba(255,255,255,${(cur ? 0.9 : 0.4) * zoneA * badgeAlpha()})`;
      ctx.fillText(String(i + 1), st.x, st.y);
    }
  });

  drawBelts(B, t);
  B.forEach(b => drawBody(B, b));

  drawShadows(B);
  // numéros des objectifs « se poser » et « faire le tour » sur les astres concernés (avant le lancement)
  const ba = badgeAlpha();
  if (ba > 0 && state === 'play') {
    const per = {};
    L.steps.forEach((st, i) => { if (i >= mission.step && st.type !== 'zone') (per[st.p] = per[st.p] || []).push(st.type === 'orbit' ? `${i + 1}↻` : String(i + 1)); });
    for (const [pi, labels] of Object.entries(per)) {
      const b = B[pi]; if (!b) continue;
      const txt = labels.join(' · '), fs = 13 / scale;
      ctx.font = `700 ${fs}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const w = Math.max(24 / scale, ctx.measureText(txt).width + 14 / scale), h = 24 / scale;
      ctx.globalAlpha = ba;
      ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.beginPath(); ctx.roundRect(b.x - w / 2, b.y - h / 2, w, h, h / 2); ctx.fill();
      ctx.fillStyle = '#000'; ctx.fillText(txt, b.x, b.y + 0.5 / scale);
      ctx.globalAlpha = 1;
    }
  }
  // astre touché : son nom écrit dedans, sans article (« la Lune » → « Lune »), sous le numéro d'objectif s'il y en a un
  if (selPlanet >= 0 && B[selPlanet]) {
    const b = B[selPlanet], name = (n => n.charAt(0).toUpperCase() + n.slice(1))((lossName(selPlanet) || '').replace(/^(le |la |l’|l')/, '')), badge = ba > 0 && state === 'play' && L.steps.some((st, i) => i >= mission.step && st.type !== 'zone' && st.p === selPlanet);
    let fs = Math.max(10, Math.min(15, b.r * scale * 0.34));
    ctx.font = `600 ${fs / scale}px ${FONT}`;
    const w = ctx.measureText(name).width; if (w > b.r * 1.7 && fs > 10) { fs = Math.max(10, fs * b.r * 1.7 / w); ctx.font = `600 ${fs / scale}px ${FONT}`; }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const y = badge ? b.y + (12 + fs * 0.9) / scale : b.y;
    ctx.lineJoin = 'round'; ctx.lineWidth = 3 / scale; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.strokeText(name, b.x, y);
    ctx.fillStyle = '#fff'; ctx.fillText(name, b.x, y);
  }

  // trajectoire de l'aide (solution conseillée)
  if (showHelp && !departed && helpRes && !helpRes.fail) { ctx.strokeStyle = 'rgba(255,255,255,0.8)'; drawPath(helpRes.path, [2, 5]); }

  // simulation vers un point + dérive prévue ensuite

      ctx.fillStyle = '#fff'; ctx.font = `600 ${11 / scale}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    const al = Math.max(0, Math.min(1, q.life / q.max)), qs = (q.sz || (q.rgb ? 2 : 1.2)) / scale; // poussière d'anneaux un peu plus grosse ; coups de redressement plus fins

    const a = 1 - (performance.now() - f.t0) / (f.dur || 260), g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * (1 + (1 - a) * 0.6));

  if (hudA <= 0) { drawEndPanel(); return; }
  let mainCtx = null;
  if (hudA < 1) {

  }

  }
  if (showHelp && !departed) {
    if (helpJob) label(`Recherche d’une solution… ${Math.round(helpJob.progress * 100)} %`, W / 2, bandTop - 80);
    else if (helpRes && helpRes.locked) label('Solution non partagée : demande-la à ton ami', W / 2, bandTop - 80);

  {
    const hold = worldH(L) > WORLD_H ? SWEEP : 1.4; // plus long pendant le balayage d'un grand voyage

    if (al > 0 && L.name) {
      ctx.globalAlpha = al; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `700 26px ${FONT}`; ctx.fillText(L.name, W / 2, H * 0.36, W - 40); ctx.globalAlpha = 1;

    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ctrl.x, ctrl.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `700 ${Math.round(r * 0.36)}px ${FONT}`; ctx.fillText('Valider', ctrl.x, ctrl.y - r * 0.16);

  }

  const hy = safeTop + 28;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.font = `600 15px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = `400 28px ${FONT}`; ctx.fillText('\u2039', 12, hy - 2); // retour à la liste des niveaux

  }

  ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 4;
  ctx.font = `400 13px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';

// question de fin, dans la zone de commande, 3 s après le crash ou l'atterrissage réussi
const hudCv = document.createElement('canvas'), END_DELAY = 3;
const endBtns = () => {
  const y = H - Math.max(safeBot, 10) - 58;
  if (testMode && state === 'won' && testRuns) { const w = Math.min(112, (W - 48) / 3); return [-1, 0, 1].map(k => ({ x: W / 2 - w / 2 + k * (w + 8), y, w, h: 46 })); } // éditeur : Rejouer · Éditeur · Analyser
  const w = Math.min(150, (W - 44) / 2); return [{ x: W / 2 - w - 6, y, w, h: 46 }, { x: W / 2 + 6, y, w, h: 46 }];
};
function drawEndPanel() {

  { const now = performance.now(), dt = Math.min(0.1, (now - endVisT) / 1000); endVisT = now; endVis += ((endHide ? 0 : 1) - endVis) * Math.min(1, dt * 7); } // fondu des boutons

  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(0, top - 40, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.35, 'rgba(0,0,0,0.6)'); g.addColorStop(1, 'rgba(0,0,0,0.85)');
  ctx.fillStyle = g; ctx.fillRect(0, top - 40, W, H - top + 40);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const [b1, b2] = endBtns(), ty = b1.y - 92;
  if (state === 'won') {
    ctx.font = `700 22px ${FONT}`; ctx.fillText('Mission accomplie !', W / 2, ty);
    ctx.font = `500 22px ${FONT}`;
    const nst = result.got.filter(Boolean).length;
    for (let k = 0; k < 3; k++) { const ok = k < nst; ctx.fillStyle = ok ? '#ffd60a' : 'rgba(255,255,255,0.35)'; ctx.fillText(ok ? '★' : '☆', W / 2 + (k - 1) * 30, ty + 32); }
    ctx.font = `400 13px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(`Gaz restant ${Math.round(result.fuelPct)} % · ${fmt(result.time)} s (objectif ${L.time} s)`, W / 2, ty + 60);
  } else {
    ctx.font = `700 22px ${FONT}`; ctx.fillText(msg, W / 2, ty + 14, W - 30);
    if (sub) { ctx.font = `400 14px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillText(sub, W / 2, ty + 44, W - 30); }
  }
  const next = testMode ? 'Éditeur' : playCtx ? 'Mes niveaux' : state === 'won' ? (lvl + 1 < LV.length ? 'Suivant' : 'Niveaux') : 'Niveaux';
  button(b1, 'Rejouer', state !== 'won'); button(b2, next, state === 'won' && !testRuns);
  const b3 = endBtns()[2]; if (b3) button(b3, 'Analyser', true);
  ctx.restore();
}
function endAction(which) { // 0 : rejouer ; 1 : suite ; 2 : analyser le vol réussi (éditeur)
  if (which === 0) { loadLevel(lvl, testMode || playCtx ? L : undefined); return; }
  if (which === 2 && testRuns) { const r = testRuns; testRuns = null; recordDone(r); return; }
  cancelJobs();
  if (testMode) backToEditor(); else if (playCtx) openPerso();
  else if (state === 'won' && lvl + 1 < LV.length) loadLevel(lvl + 1);
  else screen = 'levels';
}

// écran toujours allumé pendant une partie (Wake Lock), relancé au retour dans l'appli
let wakeLock = null, wakeWant = false;
async function keepAwake(on) {
  wakeWant = on;
  try {
    if (on && !wakeLock && 'wakeLock' in navigator && document.visibilityState === 'visible') { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if (!on && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
  } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wakeWant) keepAwake(true); });

// ===== Boucle : pas de temps fixe =====
let last = performance.now(), acc = 0;
function loop(now) {
  const fdt = Math.min(0.1, (now - last) / 1000); last = now;
  acc += fdt;
  let n = 0;
  while (acc >= DT && n < 6) { if (screen === 'game' && !document.querySelector('.modal')) tick(); acc -= DT; n++; } // jeu en pause sous une fenêtre
  if (n === 6) acc = 0;
  stateT += fdt;
  if ((screen === 'game') !== wakeWant) keepAwake(screen === 'game');
  moveWrecks(fdt); moveBigBlobs(fdt); moveFlyRocks(fdt);
  for (const q of particles) {
    if (q.wait > 0) { q.wait -= fdt; continue; } // pixel encore accroché à l'épave : il part quand l'onde de choc l'atteint
    if (!q.grav && !q.rgb && B && screen === 'game') { // gaz du réacteur : il s'écrase sur l'astre et file le long de sa surface (décollage, atterrissage)
      for (const b of B) {
        if (b.star) continue;
        const dx = q.x - b.x, dy = q.y - b.y, d2 = dx * dx + dy * dy, br = b.h ? surfR(b, dx, dy) : b.r;
        if (d2 >= br * br) continue;
        const d = Math.sqrt(d2) || 1, nx = dx / d, ny = dy / d, rvx = q.vx - b.vx, rvy = q.vy - b.vy, vn = rvx * nx + rvy * ny;
        q.x = b.x + nx * br; q.y = b.y + ny * br;
        if (vn < 0) { const tx = rvx - vn * nx, ty = rvy - vn * ny, k = 1 + 0.6 * Math.min(1, -vn / 120); q.vx = b.vx + tx * k - vn * nx * 0.12; q.vy = b.vy + ty * k - vn * ny * 0.12; }
        q.rgb = bodyColor(b.i); q.dust = true; q.life = Math.max(q.life, 0.35 + Math.random() * 0.35); q.max = 0.7;
        break;
      }
    }
    if (q.dust && B) { q.vx *= 1 - Math.min(1, 2.2 * fdt); q.vy *= 1 - Math.min(1, 2.2 * fdt); } // la poussière soulevée ralentit vite
    if (q.grav && B) { // débris d'anneaux : gravité des astres, et ils s'écrasent à leur surface
      let [ax, ay] = gravity(B, q.x, q.y);
      if (q.free !== undefined && B[q.free]) { const o = B[q.free], dx = o.x - q.x, dy = o.y - q.y, d2 = Math.max(1, dx * dx + dy * dy), g = o.m / (d2 * Math.sqrt(d2)); ax -= g * dx; ay -= g * dy; }
      q.vx += ax * fdt; q.vy += ay * fdt;
      if (bigBlobs.length) { const [bx, by] = blobGravity(q.x, q.y); q.vx += bx * fdt; q.vy += by * fdt; } // mini gravité des grosses bulles
      const rk = q.slide ? beltRockAt(q.x, q.y) : null; // les débris rebondissent et glissent aussi sur les cailloux des ceintures
      for (const b of rk ? [rk] : bigBlobs.length ? B.concat(bigBlobs) : B) {
        if (q.free !== undefined && b.i === q.free) continue;
        const dx = q.x - b.x, dy = q.y - b.y, d2 = dx * dx + dy * dy, br = b.h ? surfR(b, dx, dy) : b.r;
        if (d2 >= br * br) continue;
        if (!q.slide || b.star) { q.life = 0; break; }
        // morceau du vaisseau : il se pose et glisse sur la surface (petit rebond, frottement)
        const d = Math.sqrt(d2) || 1, nx = dx / d, ny = dy / d, rvx = q.vx - b.vx, rvy = q.vy - b.vy, vn = rvx * nx + rvy * ny;
        q.x = b.x + nx * br; q.y = b.y + ny * br;
        if (vn < 0) { const tx = rvx - vn * nx, ty = rvy - vn * ny, f = Math.max(0, 1 - 1.1 * fdt); q.vx = b.vx + tx * f - vn * nx * 0.08; q.vy = b.vy + ty * f - vn * ny * 0.08; } // frottement léger : ça glisse loin
        break;
      }
    }
    if (q.magma !== undefined && q.magma < 1) { // bulle de magma : elle refroidit en quelques secondes (orange vif → croûte sombre)
      q.magma = Math.min(1, q.magma + fdt / 7); const u = q.magma * (MAGMA_RGB.length - 1), k = Math.min(MAGMA_RGB.length - 2, Math.floor(u)), f = u - k;
      q.rgb = MAGMA_RGB[k].map((c, m) => Math.round(c + (MAGMA_RGB[k + 1][m] - c) * f)).join(',');
    }
    q.x += q.vx * fdt; q.y += q.vy * fdt; q.life -= fdt;
  }
  particles = particles.filter(q => q.life > 0 && (!q.slide || (q.x > -2000 && q.x < WORLD_W + 2000 && q.y > -2000 && q.y < worldH(L) + 2000))); // l'épave partie très loin est oubliée
  if (particles.length > 5000) particles = particles.slice(particles.length - 5000); // plafond (les plus anciens partent)
  draw();
  requestAnimationFrame(loop);
}

addEventListener('resize', resize);
resize(); loadLevel(lvl);
requestAnimationFrame(loop);

// appui long : ni sélection de texte ni menu contextuel (sauf champs de saisie et code de sauvegarde)
const selOk = t => t && t.closest && (t.closest('input,textarea') || /all|text/.test(getComputedStyle(t.nodeType === 1 ? t : t.parentElement).userSelect || ''));
document.addEventListener('selectstart', e => { if (!selOk(e.target)) e.preventDefault(); });
document.addEventListener('contextmenu', e => { if (!selOk(e.target)) e.preventDefault(); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  // mise à jour automatique : à chaque ouverture (et retour dans l'appli), on demande la dernière version au serveur ;
  // si elle existe, elle s'installe et s'active aussitôt, puis la page se recharge (en partie ou dans l'éditeur : dès le retour à l'accueil ou à la liste des niveaux)
  const hadSW = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadSW || reloading) return; reloading = true;
    const go = () => (screen === 'home' || screen === 'levels') && !document.querySelector('.modal') ? location.reload() : setTimeout(go, 500); // jamais en pleine partie ni dans l'éditeur
    go();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    const check = () => reg.update().catch(() => {});
    check();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
  }).catch(() => {});
}
</script>
