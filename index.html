<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbite">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Orbite</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#safe{position:fixed;left:0;top:0;width:1px;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script src="engine.js"></script>
<script src="niveaux.js"></script>
<script>
// ===== Jeu (portée globale : partagée avec editeur.js) =====
const APP_VERSION = 72; // à garder égal au numéro de CACHE dans sw.js
const SPEED_BAR_MAX = 200; // vitesse affichée en barre pleine (m/s)
const FONT = 'system-ui,-apple-system,sans-serif';

const cv = document.getElementById('c'); let ctx = cv.getContext('2d'); // ctx est prêté au dessin du vaisseau dans la fenêtre du centre de gravité
const safeEl = document.getElementById('safe');

let W, H, dpr, safeTop, safeBot, bandTop, gameH, scale, ox, oy, baseOy = 0, camY = 0, baseScale = 1, baseOx = 0, ctrl = { x: 0, y: 0, r: 50 }, bgStars = [];
let lvl = 0, L, ship, fuel, state = 'play', stateT = 0, msg = '', sub = '', idleT = 0;
let mission, departed = false, elapsed = 0, result = null, textures = [];
let wt = 0, launched = false, B = []; // temps monde (depuis le premier jet), astres à cet instant
// niveaux : ceux publiés depuis l'éditeur (sur cet appareil) remplacent ceux de niveaux.js
let LV = LEVELS;
try { const pub = JSON.parse(localStorage.getItem('orbite-niveaux-publies') || 'null'); if (Array.isArray(pub) && pub.length) LV = pub.length < LEVELS.length ? pub.concat(LEVELS.slice(pub.length)) : pub; } catch (e) {} // niveaux publiés sur l'appareil : complétés par les nouveaux niveaux officiels
let selPlanet = -1, taps = [], plan = null, planJob = null;
let showHelp = false, helpRes = null, helpJob = null;
let auto = null, simFlight = false, curTh = null, shadowNow = false, predHit = -1; // predHit : astre que touche la trajectoire prévue (−1 = aucun)
let tip = null, touches = new Map(), particles = []; // touches : doigts posés sur la commande (plusieurs à la fois)
let medals = {};
let screen = 'home', homeTex = null; // écrans : accueil, liste des niveaux, jeu, éditeur
let testMode = false; // partie lancée depuis l'éditeur (« Tester »)
let playCtx = null;    // partie d'un niveau perso : {kind: 'mine' (mes créations) | 'recus' (reçus d'amis), i}
// niveaux perso (créations du joueur, niveaux reçus) gardés sur l'appareil
const persoKey = k => k === 'mine' ? 'orbite-perso' : 'orbite-recus';
function persoList(k) { try { const a = JSON.parse(localStorage.getItem(persoKey(k)) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function persoSave(k, arr) { try { localStorage.setItem(persoKey(k), JSON.stringify(arr, (key, v) => key === '_B' ? undefined : v)); } catch (e) {} }
const levelTitle = () => playCtx ? (L.name || 'Niveau perso') : `Niveau ${lvl + 1}/${LV.length}`;
let shipKind = 'fusee', updState = ''; // vaisseau choisi ; état de la vérification des mises à jour
try { shipKind = localStorage.getItem('orbite-vaisseau') || 'fusee'; } catch (e) {}
// centre de gravité G de chaque vaisseau, le long de son axe : -1 = arrière, 0 = milieu (là où visent les jets), +1 = nez
const G_DEFAULT = 1; // par défaut : G au nez = rotation d'origine du jeu
let shipG = {};
try { shipG = JSON.parse(localStorage.getItem('orbite-g') || '{}') || {}; } catch (e) {}
const gOf = () => shipG[shipKind] ?? G_DEFAULT;
// redressement automatique (0 = aucun, comportement initial ; 1 = rapide) : l'arrière se tourne vers l'astre le plus proche, en consommant du gaz
const REDRESS_COST = 0.15; // gaz (secondes de pleine poussée) par radian tourné
let shipRed = {};
try { shipRed = JSON.parse(localStorage.getItem('orbite-redressement') || '{}') || {}; } catch (e) {}
const redOf = () => shipRed[shipKind] ?? 0;
let fixedNorth = false; // commande : vaisseau orienté comme en vol (boussole) ou toujours vers le nord (fixe)
try { fixedNorth = localStorage.getItem('orbite-commande') === 'fixe'; } catch (e) {}

try { lvl = Math.min(LV.length - 1, parseInt(localStorage.getItem('orbite-niveau') || '0', 10) || 0); } catch (e) {}
try { medals = JSON.parse(localStorage.getItem('orbite-medailles') || '{}') || {}; } catch (e) {}

// empreinte d'un niveau (tout ce qui change le jeu : astres, départ, objectifs, ceintures, gaz, chrono)
function levelSig(l) {
  const str = JSON.stringify([l.planets, l.start, l.steps, l.belts || null, l.fuel, l.time]);
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
// au démarrage : un niveau modifié depuis qu'on l'a joué perd ses étoiles (la mémoire de ce niveau est effacée)
function checkModifiedLevels() {
  let sigs = {};
  try { sigs = JSON.parse(localStorage.getItem('orbite-empreintes') || '{}') || {}; } catch (e) {}
  const next = {};
  LV.forEach((l, i) => {
    const sg = levelSig(l);
    if (medals[i] && sigs[i] && sigs[i] !== sg) delete medals[i];
    next[i] = sg;
  });
  Object.keys(medals).forEach(k => { if (!LV[k]) delete medals[k]; });
  try { localStorage.setItem('orbite-medailles', JSON.stringify(medals)); localStorage.setItem('orbite-empreintes', JSON.stringify(next)); } catch (e) {}
}
checkModifiedLevels();

// ===== Mise en page =====
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const cs = getComputedStyle(safeEl);
  safeTop = parseFloat(cs.paddingTop) || 0;
  safeBot = parseFloat(cs.paddingBottom) || 0;
  // le jeu occupe tout l'écran, bords compris ; les commandes se superposent en bas, collées au bord
  ctrl.r = Math.max(54, Math.min(72, W * 0.19));
  ctrl.x = W / 2; ctrl.y = H - Math.max(safeBot, 6) - ctrl.r - 4;
  bandTop = ctrl.y - ctrl.r - 30; // haut de la zone des commandes
  gameH = bandTop - safeTop;
  scale = baseScale = Math.min(W / WORLD_W, (H - safeTop) / WORLD_H);
  ox = baseOx = (W - WORLD_W * scale) / 2;
  baseOy = safeTop + (H - safeTop - WORLD_H * scale) / 2; // la vue montre toujours 2000 m de haut
  oy = baseOy - camY * scale;
  homeTex = paintBody({ type: 'terre' }, Math.min(W * 0.75, 340) * dpr, 4242);
  bgStars = [];
  for (let i = 0; i < 160; i++) bgStars.push({ x: Math.random() * W, y: Math.random() * H, a: 0.15 + Math.random() * 0.45, s: Math.random() < 0.15 ? 1.6 : 1 });
  if (L) buildTextures();
  if (screen === 'editor') editorLayout();
}

// ===== Astres réalistes (textures procédurales) =====
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// couleur hexadécimale éclaircie (k > 0) ou assombrie (k < 0)
function shade(hex, k) {
  const n = parseInt((hex || '#888888').slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k))));
  return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`;
}
// couleur d'une étoile selon sa température (temp 0 → 1) : géante rouge, orange, jaune (Soleil), blanche, naine blanche bleutée
const STAR_STOPS = [[0, [255, 90, 60]], [0.25, [255, 150, 70]], [0.5, [255, 205, 100]], [0.75, [250, 248, 255]], [1, [170, 205, 255]]];
const STAR_NAMES = ['Géante rouge', 'Orange', 'Jaune', 'Blanche', 'Naine blanche'];
function starRGB(p) {
  const t = Math.max(0, Math.min(1, p.temp ?? 0.5));
  for (let i = 1; i < STAR_STOPS.length; i++) if (t <= STAR_STOPS[i][0]) {
    const [t0, a] = STAR_STOPS[i - 1], [t1, b] = STAR_STOPS[i], k = (t - t0) / (t1 - t0);
    return a.map((v, j) => Math.round(v + (b[j] - v) * k));
  }
  return STAR_STOPS[4][1];
}
const starName = p => STAR_NAMES[Math.round(Math.max(0, Math.min(1, p.temp ?? 0.5)) * 4)];
const starLum = p => p.lum ?? 1;
const starWeight = b => { const p = L.planets[b.i]; return b.r * b.r * starLum(p); }; // part de lumière : taille × intensité
const rgbOf = hex => { const n = parseInt((hex || '#888888').slice(1), 16); return `${n >> 16},${n >> 8 & 255},${n & 255}`; };

function paintBody(p, R, seed) {
  const type = p.type;
  const S = Math.max(8, Math.ceil(R * 2)), c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d'), m = S / 2, rnd = rng(seed);
  g.beginPath(); g.arc(m, m, m, 0, Math.PI * 2); g.clip();
  const fill = col => { g.fillStyle = col; g.fillRect(0, 0, S, S); };
  const blob = (x, y, rad, col, n) => {
    g.fillStyle = col;
    for (let i = 0; i < n; i++) { const a = rnd() * Math.PI * 2, d = rnd() * rad; g.beginPath(); g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, rad * (0.25 + rnd() * 0.45), 0, Math.PI * 2); g.fill(); }
  };
  const craters = (n, dark, light, maxR) => {
    for (let i = 0; i < n; i++) {
      const x = rnd() * S, y = rnd() * S, rad = S * (0.02 + rnd() * maxR);
      g.fillStyle = dark; g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
      g.strokeStyle = light; g.lineWidth = Math.max(0.5, rad * 0.3);
      g.beginPath(); g.arc(x, y, rad, Math.PI * 0.1, Math.PI * 1.1); g.stroke();
    }
  };
  const bands = (cols, alpha) => {
    let y = 0;
    while (y < S) {
      const h = S * (0.04 + rnd() * 0.1);
      g.globalAlpha = alpha; g.fillStyle = cols[Math.floor(rnd() * cols.length)];
      g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= S; x += S / 12) g.lineTo(x, y + Math.sin(x / S * 9 + y) * S * 0.012);
      for (let x = S; x >= 0; x -= S / 12) g.lineTo(x, y + h + Math.sin(x / S * 7 + y * 2) * S * 0.012);
      g.fill(); y += h;
    }
    g.globalAlpha = 1;
  };
  const ellipses = (n, col, alpha, w, h) => {
    g.fillStyle = col;
    for (let i = 0; i < n; i++) { g.globalAlpha = alpha * (0.5 + rnd() * 0.5); g.beginPath(); g.ellipse(rnd() * S, rnd() * S, S * w * (0.5 + rnd()), S * h * (0.5 + rnd()), rnd() * 0.6 - 0.3, 0, Math.PI * 2); g.fill(); }
    g.globalAlpha = 1;
  };
  switch (type) {
    case 'terre':
      fill('#1f5fae');
      for (let i = 0; i < 6; i++) blob(rnd() * S, S * (0.2 + rnd() * 0.6), S * (0.1 + rnd() * 0.12), i % 3 ? '#3d7f3b' : '#8c7b4c', 14);
      ellipses(20, '#ffffff', 0.55, 0.12, 0.025);
      g.fillStyle = '#f4f8ff'; g.beginPath(); g.ellipse(m, 0, S * 0.35, S * 0.1, 0, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(m, S, S * 0.4, S * 0.1, 0, 0, Math.PI * 2); g.fill();
      break;
    case 'lune':
      fill('#a9a9a4');
      for (let i = 0; i < 5; i++) blob(rnd() * S, rnd() * S, S * (0.08 + rnd() * 0.1), '#80807b', 10);
      craters(16, 'rgba(90,90,86,0.55)', 'rgba(220,220,214,0.5)', 0.06);
      break;
    case 'mercure':
      fill('#8f847a');
      craters(24, 'rgba(100,90,82,0.6)', 'rgba(190,180,170,0.5)', 0.06);
      break;
    case 'mars':
      fill('#c25a30');
      for (let i = 0; i < 5; i++) blob(rnd() * S, rnd() * S, S * (0.08 + rnd() * 0.12), 'rgba(110,45,20,0.55)', 12);
      craters(8, 'rgba(140,60,30,0.6)', 'rgba(230,140,100,0.4)', 0.04);
      g.fillStyle = '#fbf3ee'; g.beginPath(); g.ellipse(m, 0, S * 0.25, S * 0.07, 0, 0, Math.PI * 2); g.fill();
      break;
    case 'venus':
      fill('#e3c58a');
      bands(['#f2deb0', '#d2ab68', '#e8cf98'], 0.5);
      ellipses(14, '#fff3d2', 0.35, 0.18, 0.03);
      break;
    case 'jupiter':
      fill('#d8bf98');
      bands(['#e8d8bb', '#b8885c', '#f1e7d3', '#a5714a', '#d9b58a', '#c4956a'], 1);
      g.fillStyle = '#b5523a'; g.beginPath(); g.ellipse(S * 0.62, S * 0.64, S * 0.13, S * 0.07, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(240,220,200,0.6)'; g.lineWidth = Math.max(1, S * 0.01); g.stroke();
      break;
    case 'saturne':
      fill('#e2cc95');
      bands(['#efdcae', '#d4b980', '#f4e7c3', '#c9aa70'], 1);
      break;
    case 'uranus':
      fill('#9fdce2');
      bands(['#b4e8ec', '#94d3da', '#a9e2e7'], 0.35);
      break;
    case 'neptune':
      fill('#3b6ee0');
      bands(['#2e57c2', '#4f82ee', '#3563d4'], 0.5);
      g.fillStyle = '#1b3480'; g.beginPath(); g.ellipse(S * 0.38, S * 0.6, S * 0.1, S * 0.055, 0, 0, Math.PI * 2); g.fill();
      ellipses(6, '#e8f0ff', 0.5, 0.06, 0.012);
      break;
    case 'soleil': {
      const gr = g.createRadialGradient(m, m, 0, m, m, m);
      if (p.temp === undefined) { gr.addColorStop(0, '#fffbe8'); gr.addColorStop(0.5, '#ffe27e'); gr.addColorStop(0.85, '#ffb22e'); gr.addColorStop(1, '#ff8a1a'); }
      else { // étoile colorée : cœur presque blanc, bord plus soutenu
        const [r, gg, bb] = starRGB(p), mix = (k, d) => `rgb(${[r, gg, bb].map(v => Math.round(Math.max(0, Math.min(255, k > 0 ? v + (255 - v) * k : v * (1 + k))))).join(',')})`;
        gr.addColorStop(0, mix(0.85)); gr.addColorStop(0.5, mix(0.35)); gr.addColorStop(0.85, mix(0)); gr.addColorStop(1, mix(-0.2));
      }
      g.fillStyle = gr; g.fillRect(0, 0, S, S);
      g.fillStyle = 'rgba(255,240,170,0.18)';
      for (let i = 0; i < 260; i++) { g.beginPath(); g.arc(rnd() * S, rnd() * S, S * 0.008 + rnd() * S * 0.01, 0, Math.PI * 2); g.fill(); }
      break;
    }
    case 'perso': { // planète personnalisée : couleur de base + aspect
      const c = p.color || '#8a7fd0', st = p.style || 'roche';
      fill(c);
      if (st === 'gaz') bands([shade(c, 0.25), shade(c, -0.2), shade(c, 0.1), shade(c, -0.35)], 0.9);
      else if (st === 'ocean') { for (let i = 0; i < 6; i++) blob(rnd() * S, S * (0.2 + rnd() * 0.6), S * (0.1 + rnd() * 0.12), shade(c, i % 2 ? -0.45 : 0.35), 14); ellipses(16, '#ffffff', 0.5, 0.12, 0.025); }
      else if (st === 'glace') { fill(shade(c, 0.55)); g.strokeStyle = shade(c, -0.2); g.lineWidth = Math.max(1, S * 0.006); for (let i = 0; i < 14; i++) { g.beginPath(); g.moveTo(rnd() * S, rnd() * S); for (let k = 0; k < 4; k++) g.lineTo(rnd() * S, rnd() * S); g.stroke(); } }
      else { for (let i = 0; i < 5; i++) blob(rnd() * S, rnd() * S, S * (0.08 + rnd() * 0.1), shade(c, -0.3), 10); craters(16, shade(c, -0.4), shade(c, 0.4), 0.05); }
      break;
    }
    default: fill('#888');
  }
  // teinte personnalisée : recolore la planète en gardant son relief (nuance = intensité)
  if (p.tint && type !== 'soleil') {
    g.globalCompositeOperation = 'color'; g.globalAlpha = p.shade ?? 0.6;
    g.fillStyle = p.tint; g.fillRect(0, 0, S, S);
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  }
  // relief sphérique
  if (type !== 'soleil') {
    const sh = g.createRadialGradient(m * 0.8, m * 0.8, m * 0.1, m, m, m);
    sh.addColorStop(0, 'rgba(255,255,255,0.08)'); sh.addColorStop(0.75, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.3)');
    g.fillStyle = sh; g.fillRect(0, 0, S, S);
  }
  return c;
}

function buildTextures() {
  textures = L.planets.map((p, i) => paintBody(p, p.r * scale * dpr, lvl * 97 + i * 13 + 7));
  bodyRGB = [];
}
// couleur moyenne d'un astre (poussière au sol, débris d'explosion)
let bodyRGB = [];
function bodyColor(i) {
  if (bodyRGB[i]) return bodyRGB[i];
  const p = L.planets[i];
  if (p && p.star) return (bodyRGB[i] = starRGB(p).join(','));
  const c = document.createElement('canvas'); c.width = c.height = 4;
  const g = c.getContext('2d'); if (textures[i]) g.drawImage(textures[i], 0, 0, 4, 4);
  const d = g.getImageData(0, 0, 4, 4).data; let r = 0, gg = 0, bb = 0, n = 0;
  for (let k = 0; k < d.length; k += 4) if (d[k + 3] > 100) { r += d[k]; gg += d[k + 1]; bb += d[k + 2]; n++; }
  return (bodyRGB[i] = n ? [r, gg, bb].map(v => Math.round(v / n)).join(',') : '150,150,150');
}

// anneaux décoratifs (Saturne par défaut, ou toute planète avec ring = couleur) : moitié arrière avant la planète, moitié avant après
// forme (ringForm) : bandes [nuance, opacité, rayon intérieur, rayon extérieur] en rayons de planète, inclinaison et aplatissement
const RING_FORMS = {
  classique: { label: 'Classique', tilt: -0.32, flat: 0.3, bands: [[0, 0.75, 1.3, 1.6], [-0.3, 0.55, 1.65, 1.8], [0.12, 0.7, 1.85, 2.25]] },
  fin: { label: 'Fin', tilt: -0.32, flat: 0.3, bands: [[0, 0.8, 1.55, 1.75]] },
  large: { label: 'Large', tilt: -0.25, flat: 0.32, bands: [[-0.15, 0.6, 1.25, 1.7], [0.1, 0.75, 1.7, 2.4], [-0.25, 0.5, 2.4, 2.9]] },
  double: { label: 'Double', tilt: -0.32, flat: 0.3, bands: [[0.05, 0.75, 1.3, 1.6], [0.05, 0.75, 2.0, 2.3]] },
  penche: { label: 'Penché', tilt: -0.9, flat: 0.42, bands: [[0, 0.75, 1.35, 1.7], [0.15, 0.6, 1.75, 2.1]] },
};
const RING_COLORS = ['#d6c496', '#bfe3f2', '#c47a4a', '#a58cd6', '#7fc9a0', '#9a9a9a', '#e8a0b4'];
const hasRings = p => p.ring !== false && (!!p.ring || p.type === 'saturne'); // étoiles comprises
const ringColor = p => typeof p.ring === 'string' ? p.ring : '#d6c496';
const ringForm = p => { const f = RING_FORMS[p.ringForm] || RING_FORMS.classique; return p.ringTilt === undefined ? f : { ...f, tilt: p.ringTilt * Math.PI / 180 }; }; // ringTilt : rotation des anneaux autour de l'astre (degrés)
// découpage en cellules (rayon × angle) : le vaisseau détruit les cellules qu'il traverse
const RING_SEG = 160, RING_DR = 0.08;
function ringCells(p) {
  const f = ringForm(p), rows = [];
  for (const [k, al, a, b] of f.bands) for (let r = a; r < b - 1e-6; r += RING_DR) rows.push({ k, al, a: r, b: Math.min(b, r + RING_DR) });
  return rows;
}
let ringHoles = {}; // index de l'astre → Set de « rangée:segment » détruits (remis à zéro à chaque niveau)
function drawRings(p, x, y, front, i) {
  const f = ringForm(p), c = ringColor(p), holes = screen === 'game' ? ringHoles[i] : null, rows = ringCells(p), da = Math.PI * 2 / RING_SEG;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(f.tilt); ctx.scale(1, f.flat);
  const s0 = front ? 0 : RING_SEG / 2, s1 = s0 + RING_SEG / 2;
  rows.forEach((row, ri) => {
    ctx.globalAlpha = row.al; ctx.strokeStyle = shade(c, row.k); ctx.lineWidth = (row.b - row.a) * p.r + 0.5 / scale;
    const rr = (row.a + row.b) / 2 * p.r;
    if (!holes || !holes.size) { ctx.beginPath(); ctx.arc(0, 0, rr, s0 * da, s1 * da); ctx.stroke(); return; }
    let start = -1;
    for (let sg = s0; sg <= s1; sg++) {

// Recherche découpée en tranches : retient la solution au meilleur compromis temps / gaz
// pts : simulation du joueur : route vers le(s) point(s) au moins de gaz possible
function search(pts, budget, done) {
  const job = { cancel: false, progress: 0 }, LS = L; // calcul complet : astres en mouvement et ombres, pour une route sûre
  if (pts) budget = Math.max(budget, 600);
  let best = null, n = 0;
  const slice = () => {
    if (job.cancel) return;
    const t0 = performance.now();
    while (performance.now() - t0 < 25 && n < budget) {
      const P = best && n > budget / 3 ? mutate(best.P, Math.random, n > budget * 0.7 ? 0.4 : 1, worldH(L)) : randP(L, !pts);
      const r = fly(LS, P, pts);
      if (r.ok) { const c = pts ? r.used + 0.01 * r.t : ratioCost(L, r); if (!best || c < best.c) best = { P, c, used: r.used, path: r.path, end: r.end }; }
      n++;
    }
    job.progress = n / budget;
    if (n < budget) setTimeout(slice, 0); else done(best);
  };
  setTimeout(slice, 0);
  return job;
}

// suite de la route après le point visé, sans rien révéler : elle traverse les astres comme s'ils n'existaient pas (ni croix, ni arrêt)
function freeCoast(o) {
  let x = o.x, y = o.y, vx = o.vx, vy = o.vy;
  const h = 1 / 120, path = [[x, y]], t0 = o.tw || 0, hh = worldH(L);
  for (let i = 1; i <= 1200; i++) {
    const Bt = snapshot(L, t0 + i * h);
    let ax = 0, ay = 0;
    for (const b of Bt) { const dx = b.x - x, dy = b.y - y, d2 = Math.max(dx * dx + dy * dy, b.r * b.r), d = Math.sqrt(d2), g = b.m / d2; ax += g * dx / d; ay += g * dy / d; } // adoucie dans l'astre
    vx += ax * h; vy += ay * h; x += vx * h; y += vy * h;
    if (i % 6 === 0) path.push([x, y]);
    if (x < -OUT_MARGIN || x > WORLD_W + OUT_MARGIN || y < -OUT_MARGIN || y > hh + OUT_MARGIN) break;
  }
  return { path, hit: null };
}
function runPlan() {

}

// ===== Commande =====
// clavier (PC) : flèches, ZQSD ou WASD = poussée dans la direction de la touche (diagonales possibles)
const keys = new Set();
const KEY_DIR = { arrowup: [0, -1], z: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], q: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
function keyThrust() {
  let x = 0, y = 0;
  for (const k of keys) { const v = KEY_DIR[k]; if (v) { x += v[0]; y += v[1]; } }
  const d = Math.hypot(x, y);
  return d ? { x: x / d, y: y / d, p: 1 } : null;
}

// mode fixe : la commande est dans le repère du vaisseau (son nez = le haut du cercle)
const toShip = (v, sgn) => {
  const a = sgn * (ship.ang + Math.PI / 2), c = Math.cos(a), s = Math.sin(a);
  return { x: v.x * c - v.y * s, y: v.x * s + v.y * c, p: v.p };
};
// un doigt → un jet, dans le repère de la commande (haut du cercle = haut de l'écran, ou nez du vaisseau en mode fixe)
function fingerJet(t) {
  const dx = t.x - ctrl.x, dy = t.y - ctrl.y, d = Math.hypot(dx, dy);
  if (d < ctrl.r * 0.12) return null;
  // doigt à droite → gaz éjecté à droite → poussée vers la gauche
  const v = { x: -dx / d, y: -dy / d, p: Math.min(1, d / ctrl.r) };
  if (!fixedNorth) return v;
  // mode fixe : 4 directions seulement (avant, arrière, gauche, droite), la puissance est conservée
  return Math.abs(v.x) >= Math.abs(v.y) ? { x: Math.sign(v.x), y: 0, p: v.p } : { x: 0, y: Math.sign(v.y), p: v.p };
}
const ctrlJets = () => [...touches.values()].map(fingerJet).filter(Boolean);
// poussée totale : somme des jets ; chaque jet consomme son propre gaz (fuel = somme des puissances)
function thrustInput() {
  if (state !== 'play') return null;
  let jets = ctrlJets();
  if (!touches.size && keys.size) { const k = keyThrust(); jets = k ? [fixedNorth ? (Math.abs(k.x) >= Math.abs(k.y) ? { x: Math.sign(k.x), y: 0, p: 1 } : { x: 0, y: Math.sign(k.y), p: 1 }) : k] : []; }
  if (!jets.length) return null;
  const w = jets.map(v => fixedNorth ? toShip(v, 1) : v);
  let sx = 0, sy = 0, f = 0;
  for (const v of w) { sx += v.x * v.p; sy += v.y * v.p; f += v.p; }
  const m = Math.sqrt(sx * sx + sy * sy);
  return m > 1e-6 ? { x: sx / m, y: sy / m, p: m, fuel: f, jets: w } : { x: 0, y: 0, p: 0, fuel: f, jets: w };
}

// vérifier les mises à jour sans réinstaller l'appli : télécharge la nouvelle version puis recharge
async function checkUpdate() {
  if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost')) { updState = 'Indisponible ici (appli non installée)'; return; }
  updState = 'Recherche…';
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) { updState = 'Indisponible'; return; }
    await reg.update();
    const nw = reg.installing || reg.waiting;
    if (!nw) { updState = 'Tu as la dernière version'; return; }
    updState = 'Installation de la mise à jour…';
    navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
    nw.addEventListener('statechange', () => { if (nw.state === 'activated') location.reload(); });
    nw.postMessage('skipWaiting');
  } catch (e) { updState = 'Vérification impossible (hors ligne ?)'; }
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (screen === 'editor') { editorPointerDown(e); return; }
  if (screen === 'perso' || screen === 'tuto') return;
  if (screen === 'home') {
    if (inBox(e, playBtn())) { loadLevel(lvl); screen = 'game'; }
    else if (inBox(e, levelsBtn())) screen = 'levels';
    else if (inBox(e, homeLayout().tuto)) openTutorial();
    else if (inBox(e, editorBtn())) openEditorLogin();
    else {
      const hl = homeLayout();
      if (inBox(e, hl.ship)) openShipPicker();
      else if (inBox(e, hl.clear)) clearProgress();
      else if (inBox(e, hl.update)) checkUpdate();
    }
    return;
  }
  if (screen === 'levels') {
    if (inBox(e, backBtn())) { screen = 'home'; return; }
    const tb = pageTabs().find(b => inBox(e, b));
    if (tb) { levelPage = tb.k; return; }
    const t = levelTiles().find(b => inBox(e, b));
    if (t && levelOpen(t.i)) { loadLevel(t.i); screen = 'game'; } // niveau verrouillé : il faut au moins une étoile au précédent
    return;
  }
  // avant le lancement : deux doigts dans la zone de jeu = zoom / déplacement (le premier appui est alors annulé)
  if (state === 'play' && !departed && e.clientY < bandTop && e.clientY > safeTop + 50) {
    gamePtrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    if (gamePtrs.size >= 2) {
      if (!pinch) {
        if (tapUndo && performance.now() - tapUndo.t < 700) { if (planJob) { planJob.cancel = true; planJob = null; } taps = tapUndo.taps; plan = tapUndo.plan; selPlanet = tapUndo.sel; }
        pinchStart();
      }
      return;
    }
  }
  if (state !== 'play') { // fin de partie : seulement les deux boutons de la question, une fois affichée
    if (stateT < END_DELAY) return;
    const k = endBtns().findIndex(b => inBox(e, b));
    if (k >= 0) endAction(k);
    return;
  }
  if (inBox(e, menuBtn())) { cancelJobs(); if (testMode) backToEditor(); else if (playCtx) openPerso(); else screen = 'levels'; return; }
  if (inBox(e, restartBtn())) { loadLevel(lvl, testMode || playCtx ? L : undefined); return; }
  if (state === 'play' && inBox(e, gBtn())) { touches.clear(); keys.clear(); openGModal(); return; }
  if (state === 'play' && inBox(e, modeBtn())) { fixedNorth = !fixedNorth; try { localStorage.setItem('orbite-commande', fixedNorth ? 'fixe' : 'boussole'); } catch (err) {} return; }
  // avant le lancement : un appui sur une icône de statut l'explique
  if (!departed) {
    const ii = statusIcons().findIndex(b => inBox(e, b));
    if (ii >= 0) { tip = tip && tip.i === ii ? null : { i: ii, until: performance.now() + 4000 }; return; }
  }
  tip = null;
  tapUndo = { t: performance.now(), taps: taps.slice(), plan, sel: selPlanet };
  if (!departed && taps.length) {
    // simulation affichée : « Valider » lance le pilote auto ; tout autre appui annule la simulation (sans décoller)
    if (canValidate() && Math.hypot(e.clientX - ctrl.x, e.clientY - ctrl.y) <= validBtn().w / 2) { auto = { P: plan.P, pts: taps.slice(), i: 0 }; simFlight = true; validT = performance.now(); depart(); }
    else if (taps.length === 1 && e.clientY < bandTop && e.clientY > safeTop + 50 && planetAt(e.clientX, e.clientY) < 0) { taps.push(simPoint(e.clientX, e.clientY)); runPlan(); } // 2e point de passage
    else { taps = []; plan = null; if (planJob) { planJob.cancel = true; planJob = null; } }
    return;
  }
  const inGame = e.clientY < bandTop && e.clientY > safeTop + 50;
  if (!departed) {
    if (inBox(e, helpBtn())) { toggleHelp(); return; }
    if (inGame) {
      const pi = planetAt(e.clientX, e.clientY); // un astre touché : sa gravité et son orbite (un seul à la fois)
      if (pi >= 0) { selPlanet = selPlanet === pi ? -1 : pi; return; }
      taps = [simPoint(e.clientX, e.clientY)]; runPlan(); // le vide touché : simulation vers ce point
      return;
    }
  } else if (inGame) { // en vol : les astres restent cliquables
    const pi = planetAt(e.clientX, e.clientY);
    if (pi >= 0) selPlanet = selPlanet === pi ? -1 : pi;
    return;
  }
  // avant le lancement, seule la zone du cercle de commande réagit ; ensuite tout le bandeau
  if (simFlight && performance.now() - validT < 700) return; // un 2e appui trop rapide ne coupe pas le pilote auto
  if (e.clientY >= bandTop && (departed || Math.hypot(e.clientX - ctrl.x, e.clientY - ctrl.y) <= ctrl.r)) {
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  }
}, { passive: false });
cv.addEventListener('pointermove', e => {
  if (screen === 'editor') { editorPointerMove(e); return; }
  const g = gamePtrs.get(e.pointerId); if (g) { g.x = e.clientX; g.y = e.clientY; if (pinch && gamePtrs.size >= 2 && !departed) pinchMove(); }
  const t = touches.get(e.pointerId); if (t) { t.x = e.clientX; t.y = e.clientY; }
});
const release = e => {
  if (screen === 'editor') { editorPointerUp(e); return; }
  touches.delete(e.pointerId);
  if (gamePtrs.delete(e.pointerId) && pinch && gamePtrs.size < 2) { pinch = null; clearTimeout(release.t); release.t = setTimeout(buildTextures, 150); } // textures nettes au nouveau zoom
};
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());

addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || document.querySelector('.modal')) return;
  const k = e.key.toLowerCase();
  if (screen !== 'game') return;
  if (KEY_DIR[k]) {
    e.preventDefault();
    if (state !== 'play') return;
    // simulation affichée : une touche l'annule sans décoller (comme un appui ailleurs que sur « Valider »)
    if (!departed && taps.length) { taps = []; plan = null; if (planJob) { planJob.cancel = true; planJob = null; } return; }
    keys.add(k);
    return;
  }
  if (k === 'r') loadLevel(lvl, testMode || playCtx ? L : undefined);                       // recommencer
  else if (k === 'escape') { cancelJobs(); keys.clear(); if (testMode) backToEditor(); else if (playCtx) openPerso(); else screen = 'levels'; } // retour
  else if (k === 'enter') {
    if (state === 'play' && canValidate()) { auto = { P: plan.P, pts: taps.slice(), i: 0 }; simFlight = true; depart(); } // valider la trajectoire
    else if (state === 'won' && stateT > END_DELAY) endAction(1);
    else if (state === 'lost' && stateT > END_DELAY) endAction(0);
  } else if ((k === 'h' || k === '?') && !departed && state === 'play') toggleHelp(); // aide (débloquée après 5 échecs)
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

// rotation par le joueur : les jets visent le milieu du vaisseau ; l'écart avec G crée le couple
// G vers le nez → le nez se tourne vers la poussée ; G au milieu → aucune rotation ; G vers l'arrière → la queue se tourne vers la poussée
function turnG(s, th, dt) {
  const k = gOf();
  if (k >= 1) { turn(s, th, dt); return; } // G au nez : exactement le comportement initial
  const nx = Math.cos(s.ang), ny = Math.sin(s.ang);
  const cr = nx * th.y - ny * th.x, d = Math.atan2(cr, nx * th.x + ny * th.y);
  let w = TURN_RATE * k * th.p * cr * dt;
  if (k > 0 && Math.abs(w) > Math.abs(d)) w = d; // sans dépasser l'alignement
  s.ang += w;
}

// fenêtre du centre de gravité : le vaisseau choisi en grand, le point rouge G se déplace vers l'avant ou l'arrière
// boîte du dessin de chaque vaisseau (unités de dessin, nez vers y négatif), mesurée une fois sur un canevas hors écran
const shipBox = {};
function measureShip(kind) {
  if (shipBox[kind]) return shipBox[kind];
  const S = 9, CW = 220, CH = 280, c = document.createElement('canvas'); c.width = CW; c.height = CH;
  const main = ctx; ctx = c.getContext('2d');
  drawShip(kind, CW / 2, CH / 2, -Math.PI / 2, S, false, false);
  const im = ctx.getImageData(0, 0, CW, CH).data; ctx = main;
  let t = CH, b = 0, l = CW, r = 0;
  for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) if (im[(y * CW + x) * 4 + 3] > 20) { t = Math.min(t, y); b = Math.max(b, y); l = Math.min(l, x); r = Math.max(r, x); }
  return (shipBox[kind] = { t: (t - CH / 2) / S, b: (b - CH / 2) / S, l: (l - CW / 2) / S, r: (r - CW / 2) / S });
}
const gLocalY = kind => { const k = measureShip(kind); return (k.t + k.b) / 2 - gOf() * (k.b - k.t) / 2; };
// point de sortie du gaz : depuis G, dans la direction d'éjection (ex, ey), jusqu'à la coque du vaisseau
// point du dessin du vaisseau (unités de dessin, −y = nez) → monde
function shipPoint(dx, dy) {
  const unit = Math.max(1, 1.15 / scale), off = HULL_R - 8.6 * unit, nx = Math.cos(ship.ang), ny = Math.sin(ship.ang);
  const px = dx * unit, py = dy * unit + off;
  return { x: ship.x + px * -ny - py * nx, y: ship.y + px * nx - py * ny };
}
function jetOrigin(ex, ey) {
  const k = measureShip(shipKind), unit = Math.max(1, 1.15 / scale), off = HULL_R - 8.6 * unit;
  const nx = Math.cos(ship.ang), ny = Math.sin(ship.ang); // nez ; droite du vaisseau = (-ny, nx)
  const lx = ex * -ny + ey * nx, ly = -(ex * nx + ey * ny), gy = (k.t + k.b) / 2; // visuel : comme si G était au centre du dessin
  const hw = 0.7 * (k.r - k.l) / 2; // largeur du corps (sans le bout des ailerons)
  let tt = Infinity;
  if (lx > 1e-6) tt = Math.min(tt, hw / lx); else if (lx < -1e-6) tt = Math.min(tt, -hw / lx);
  if (ly > 1e-6) tt = Math.min(tt, (k.b - gy) / ly); else if (ly < -1e-6) tt = Math.min(tt, (k.t - gy) / ly);
  const px = lx * tt * unit, py = (gy + ly * tt) * unit + off; // repère local tourné (−y = nez)
  return { x: ship.x + px * -ny - py * nx, y: ship.y + px * nx - py * ny };
}
// choix du vaisseau (depuis l'accueil, en touchant le vaisseau)
function openShipPicker() {
  modal((box, close) => {
    const grid = el('div', { style: 'display:grid;grid-template-columns:repeat(3,1fr);gap:10px' });
    for (const sh of SHIPS) {
      const S = 84, c = el('canvas', { width: S * dpr, height: S * dpr, style: `position:static;display:block;width:${S}px;height:${S}px;margin:0 auto` });
      const k = measureShip(sh.id), u = Math.min((S - 14) / (k.b - k.t), (S - 14) / (k.r - k.l));
      const g = c.getContext('2d'), main = ctx; ctx = g; g.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawShip(sh.id, S / 2 - (k.l + k.r) / 2 * u, S / 2 - (k.t + k.b) / 2 * u, -Math.PI / 2, u, false, false); ctx = main;
      const on = sh.id === shipKind;
      grid.append(el('div', { style: `cursor:pointer;border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;background:${on ? 'rgba(255,255,255,.14)' : '#1c1c20'};border:${on ? '2px solid #fff' : '1px solid rgba(255,255,255,.15)'}`,
        onclick: () => { shipKind = sh.id; try { localStorage.setItem('orbite-vaisseau', shipKind); } catch (err) {} close(); } }, c, el('div', { style: 'margin-top:4px' }, sh.name)));
    }
    box.append(el('h3', {}, 'Vaisseau'), grid);
  });
}

function openGModal() {
  const save = () => { try { localStorage.setItem('orbite-g', JSON.stringify(shipG)); localStorage.setItem('orbite-redressement', JSON.stringify(shipRed)); } catch (e) {} };
  const card = 'flex:1;min-width:0;background:#1c1c20;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:10px';
  const ttl = t => el('div', { style: 'font-size:13px;font-weight:700;text-align:center;line-height:1.2' }, t);
  const hint = t => el('div', { style: 'font-size:11px;line-height:1.35;color:rgba(255,255,255,.55);text-align:center' }, t);
  const sbtn = (t, f, st = '') => el('button', { style: 'min-height:36px;padding:0 8px;font-size:13px;' + st, onclick: f }, t);

  // carte 1 : centre de gravité (vaisseau en grand, point G rouge)
  const CW = 130, CH = 190, c = el('canvas', { width: CW * dpr, height: CH * dpr, style: `position:static;display:block;width:${CW}px;height:${CH}px` });
  const g2 = c.getContext('2d');
  const paint = () => {
    const k = measureShip(shipKind), S = Math.min((CH - 16) / (k.b - k.t), (CW - 30) / (k.r - k.l));
    const x0 = CW / 2 - (k.l + k.r) / 2 * S, y0 = CH / 2 - (k.t + k.b) / 2 * S;
    const main = ctx; ctx = g2;
    g2.setTransform(dpr, 0, 0, dpr, 0, 0); g2.clearRect(0, 0, CW, CH);
    drawShip(shipKind, x0, y0, -Math.PI / 2, S, false, false);
    ctx = main;
    const gy = y0 + gLocalY(shipKind) * S;
    g2.fillStyle = '#ff3b30'; g2.strokeStyle = '#fff'; g2.lineWidth = 2;
    g2.beginPath(); g2.arc(x0, gy, 7, 0, Math.PI * 2); g2.fill(); g2.stroke();
    g2.font = `700 14px ${FONT}`; g2.textAlign = 'left'; g2.textBaseline = 'middle'; g2.fillText('G', x0 + 11, gy);
  };
  const moveG = dv => { shipG[shipKind] = Math.max(-1, Math.min(1, Math.round((gOf() + dv) * 10) / 10)); save(); paint(); };
  const cardG = el('div', { style: card }, ttl('Centre de gravité'), c,
    el('div', { class: 'row', style: 'width:100%' }, sbtn('▲', () => moveG(0.1), 'flex:1'), sbtn('▼', () => moveG(-0.1), 'flex:1')),
    hint('Nez : pivote vers la poussée. Centre : ne pivote pas. Arrière : pivote à l’inverse.'),
    sbtn('Reset', () => { delete shipG[shipKind]; save(); paint(); }, 'width:100%;margin-top:auto'));

  // carte 2 : redressement automatique, curseur vertical (du bas = arrêt, vers le haut = rapide)
  const TH = 190, fill = el('div', { style: 'position:absolute;left:0;right:0;bottom:0;border-radius:7px;background:linear-gradient(#ff9f0a,#ffd60a)' });
  const knob = el('div', { style: 'position:absolute;left:50%;width:30px;height:30px;margin-left:-15px;border-radius:15px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5)' });
  const track = el('div', { style: `position:relative;width:14px;height:${TH}px;border-radius:7px;background:rgba(255,255,255,.12)` }, fill, knob);
  const val = el('div', { style: 'font-size:13px;font-weight:700;min-height:16px' });
  const warn = el('div', { style: 'font-size:12px;line-height:1.4;padding:10px 12px;border-radius:12px;background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.45);color:#ffcc80' },
    '⚠️ Le redressement auto ', el('b', {}, 'consomme du gaz'), '.');
  const showR = () => {
    const v = redOf();
    fill.style.height = v * 100 + '%'; knob.style.bottom = `calc(${v * 100}% - 15px)`;
    val.textContent = v ? Math.round(v * 100) + ' %' : 'Arrêt'; val.style.color = v ? '#ffd60a' : 'rgba(255,255,255,.55)';
    warn.style.opacity = v ? 1 : 0.6;
  };
  const setR = y => { const r = track.getBoundingClientRect(), v = Math.max(0, Math.min(1, Math.round((1 - (y - r.top) / r.height) * 20) / 20)); if (v) shipRed[shipKind] = v; else delete shipRed[shipKind]; save(); showR(); };
  const zone = el('div', { style: 'padding:15px 20px;touch-action:none;cursor:pointer;display:flex;justify-content:center' }, track);
  zone.addEventListener('pointerdown', e => { e.preventDefault(); zone.setPointerCapture(e.pointerId); setR(e.clientY); });
  zone.addEventListener('pointermove', e => { if (zone.hasPointerCapture(e.pointerId)) setR(e.clientY); });
  const cardR = el('div', { style: card }, ttl('Redressement auto'), val, zone,
    hint('Si la trajectoire touche un astre, le vaisseau s’oriente pour s’y poser.'),
    sbtn('Reset', () => { delete shipRed[shipKind]; save(); showR(); }, 'width:100%;margin-top:auto'));

  modal((box, close) => {
    box.style.width = 'min(100%,380px)';
    box.append(el('h3', {}, 'Réglages du vaisseau'),
      el('div', { style: 'display:flex;gap:10px;align-items:stretch' }, cardG, cardR),
      warn, el('button', { class: 'pri', onclick: close }, 'OK'));
    paint(); showR();
  });
}

// ===== Physique : pas fixe identique à la simulation =====
function tick() {
  if (state !== 'play') { // fin de partie : le temps continue (astres, lunes, vaisseau posé), rien ne se commande
    const h = DT / SUB;
    if (!ship.dead) for (let k = 0; k < SUB; k++) physStep(launched ? snapshot(L, wt + k * h) : B, ship, null, h);
    if (launched) wt += DT;
    B = snapshot(L, wt);
    return;
  }
  const B0 = snapshot(L, wt);
  let th = thrustInput();
  const byPlayer = !!th;
  if (th) auto = null; // le joueur reprend la main
  else if (auto) {
    // même logique que fly() : points de passage dans l'ordre, arrêt au dernier
    const ap = auto.pts;
    if (hyp(ap[auto.i][0] - ship.x, ap[auto.i][1] - ship.y) < 30 && ++auto.i >= ap.length) auto = null; // objectif de la simulation atteint
    else th = steer(B0, ship, ap[auto.i][0], ap[auto.i][1], auto.i < ap.length - 1 ? auto.P.vmax : 0, auto.P);
  }
  if (fuel <= 0) th = null;
  shadowNow = inShadow(B0, ship.x, ship.y);
  if (shadowNow) th = null; // dans l'ombre : commandes coupées
  curTh = th;
  if (th && !departed) depart();
  if (th) launched = true; // le chrono et les lunes démarrent au premier jet
  if (th && th.p > 0) { if (byPlayer) turnG(ship, th, DT); else turn(ship, th, DT); } // le pilote auto garde la rotation du solveur
  // redressement automatique (réglage du vaisseau) : en vol, sans poussée du joueur ni pilote auto ; consomme du gaz
  const red = redOf();
  if (red > 0 && departed && !byPlayer && !auto && !shadowNow && fuel > 0 && ship.airT > 0) {
    // seulement si la trajectoire prévue (celle tracée devant le vaisseau) va toucher un astre : on se redresse vers lui ; en orbite, rien
    const tb = predHit >= 0 && B0[predHit] && !B0[predHit].star ? B0[predHit] : null;
    if (tb) {
      let d = Math.atan2(ship.y - tb.y, ship.x - tb.x) - ship.ang; d = Math.atan2(Math.sin(d), Math.cos(d)); // nez à l'opposé de l'astre
      const m = TURN_RATE * red * DT, w = Math.max(-m, Math.min(m, d));
      ship.ang += w; fuel = Math.max(0, fuel - REDRESS_COST * Math.abs(w));
      // visuel seulement : petits coups de gaz bleutés, saccadés, au nez et à la queue (couple de rotation)
      if (Math.abs(w) > 1e-4 && Math.floor(performance.now() / 110) % 2 === 0) redressFx = { sg: Math.sign(w), t: performance.now() }; // repris sur la commande
      if (Math.abs(w) > 1e-4 && Math.floor(performance.now() / 110) % 2 === 0 && Math.random() < 0.35 + 0.65 * Math.abs(w) / m) {
        const k = measureShip(shipKind), sg = Math.sign(w), sx = -Math.sin(ship.ang) * sg, sy = Math.cos(ship.ang) * sg; // sens où part le nez
        const hw = 0.75 * (k.r - k.l) / 2; // bord du corps
        for (const [dy, e] of [[k.t + (k.b - k.t) * 0.18, -1], [k.b - (k.b - k.t) * 0.18, 1]]) {
          const o = shipPoint(-e * sg * hw, dy);
          for (let n = 0; n < 2; n++) {
            const v = 35 + Math.random() * 35, sp = 0.3 - Math.random() * 0.6;
            const ex = e * sx, ey = e * sy, cx = ex * Math.cos(sp) - ey * Math.sin(sp), cy = ex * Math.sin(sp) + ey * Math.cos(sp);
            particles.push({ x: o.x, y: o.y, vx: ship.vx + cx * v, vy: ship.vy + cy * v, life: 0.18 + Math.random() * 0.17, max: 0.35, rgb: '170,215,255', sz: 1 });
          }
        }
      }
    }
  }
  if (th) for (const jt of th.jets || [th]) {
    const n = Math.ceil(2 * jt.p);
    for (let i = 0; i < n; i++) {
      const sp = (0.35 - Math.random() * 0.7), ex = -jt.x, ey = -jt.y;
      const cx = ex * Math.cos(sp) - ey * Math.sin(sp), cy = ex * Math.sin(sp) + ey * Math.cos(sp), v = 90 + Math.random() * 90 * jt.p;
      const o = jetOrigin(ex, ey);
      particles.push({ x: o.x, y: o.y, vx: ship.vx + cx * v, vy: ship.vy + cy * v, life: 0.25 + Math.random() * 0.3, max: 0.55 });
    }
  }
  // vol enregistré (éditeur, « piloter moi-même ») : valeurs arrondies appliquées telles quelles, pour un rejeu identique
  if (recMode) {
    const q = v => Math.round(v * 1e4) / 1e4;
    if (th) th = { x: q(th.x), y: q(th.y), p: q(th.p), fuel: q(th.fuel ?? th.p), jets: th.jets };
    ship.ang = q(ship.ang);
    const fr = th ? [th.x, th.y, th.p, th.fuel, ship.ang] : [ship.ang], last = recMode.runs[recMode.runs.length - 1];
    if (last && last.length === fr.length + 1 && fr.every((v, k) => v === last[k + 1])) last[0]++; else recMode.runs.push([1, ...fr]);
  }
  const h = DT / SUB;
  let landedOn = -1, landed = false;
  for (let k = 0; k < SUB; k++) {
    if (th) fuel = Math.max(0, fuel - h * (th.fuel ?? th.p));
    const r = physStep(launched ? snapshot(L, wt + k * h) : B0, ship, th, h);
    if (r.crash) { lose(r.crash, r.p ?? -1); return; }
    if (r.contact >= 0) { landed = true; if (r.wasAir > 0.5) landedOn = r.contact; }
    if (outOfBounds(ship, worldH(L))) { lose('out'); return; }
  }
  if (launched) wt += DT;
  elapsed = wt;
  B = snapshot(L, wt);
  // traversée d'anneaux : des poussières s'en échappent (sans effet sur le vaisseau)
  for (const b of B) {
    const p = L.planets[b.i];
    if (hasRings(p) && inRings(p, b.x, b.y, ship.x, ship.y)) breakRings(p, b.i, b.x, b.y);
  }
  missionTick(L, B, mission, ship, DT, landedOn);
  if (mission.done) { win(); return; }
  if (landed && (fuel <= 0 || shadowNow) && Math.hypot(ship.vx, ship.vy) < 2) {
    idleT += DT;
    if (idleT > 1.5) {
      if (fuel <= 0) lose('fuel');
      else { // dans l'ombre : on attend si un astre en mouvement doit laisser repasser la lumière ; sinon c'est perdu
        if (waitLight === null) waitLight = lightReturns();
        if (!waitLight) lose('shadow');

}

// la lumière reviendra-t-elle sur le vaisseau posé ? (astres en mouvement, sur les 2 prochaines minutes)
let waitLight = null, redressFx = { sg: 1, t: -1e9 };
function lightReturns() {
  if (!hasMoons(L)) return false;
  let j = 0, bd = Infinity;
  for (const b of B) { const d = hyp(ship.x - b.x, ship.y - b.y) - b.r; if (d < bd) { bd = d; j = b.i; } }
  const rx = ship.x - B[j].x, ry = ship.y - B[j].y; // le vaisseau suit l'astre sur lequel il est posé
  for (let k = 1; k <= 480; k++) { const Bt = snapshot(L, wt + k * 0.25), q = Bt[j]; if (!inShadow(Bt, q.x + rx, q.y + ry)) return true; }
  return false;
}

// image du vaisseau en pixels (unités de dessin), mesurée une fois par modèle : [dx, dy, "r,g,b"]
const shipPixels = {};
function shipPixelsOf(kind) {
  if (shipPixels[kind]) return shipPixels[kind];
  const S = 2, CW = 80, CH = 100, c = document.createElement('canvas'); c.width = CW; c.height = CH;
  const main = ctx; ctx = c.getContext('2d');
  drawShip(kind, CW / 2, CH / 2, -Math.PI / 2, S, false, false);
  const im = ctx.getImageData(0, 0, CW, CH).data; ctx = main;
  const out = [];
  for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) { // un pixel tous les demi-points de dessin : le vaisseau entier
    const k = (y * CW + x) * 4;
    if (im[k + 3] > 90) out.push([(x - CW / 2) / S, (y - CH / 2) / S, `${im[k]},${im[k + 1]},${im[k + 2]}`]);
  }
  return (shipPixels[kind] = out);
}
// explosion : le vaisseau se désagrège pixel par pixel, en partant du point d'impact ; les pixels gardent leur couleur,
// subissent la gravité et s'écrasent sur les astres (comme les débris d'anneaux) ; dans une étoile, ils prennent sa couleur et s'évanouissent
function boom(pi = -1, why = '') {
  let P = pi >= 0 ? L.planets[pi] : null, star = why === 'star' && P, body = pi >= 0 ? bodyColor(pi) : null, bd = pi >= 0 ? B[pi] : null;
  if (why === 'belt') { // ceinture : le choc se fait sur le caillou le plus proche, traité comme un petit astre
    const rk = beltRockAt(ship.x, ship.y, 40);
    P = null; bd = rk ? { x: rk.x, y: rk.y, r: rk.r, vx: rk.vx, vy: rk.vy } : null; body = rk ? rgbOf(rk.c) : '141,128,112';
  }
  const unit = Math.max(1, 1.15 / scale), sz = Math.max(0.45, unit * scale * 0.4);
  let nx = 0, ny = 0, bvx = 0, bvy = 0, ix = ship.x, iy = ship.y;
  if (bd) { const d = hyp(ship.x - bd.x, ship.y - bd.y) || 1; nx = (ship.x - bd.x) / d; ny = (ship.y - bd.y) / d; bvx = bd.vx; bvy = bd.vy; ix = bd.x + nx * bd.r; iy = bd.y + ny * bd.r; }
  const rvx = ship.vx - bvx, rvy = ship.vy - bvy, rvn = rvx * nx + rvy * ny, tvx = rvx - rvn * nx, tvy = rvy - rvn * ny, sp = hyp(rvx, rvy);
  for (const [dx, dy, col] of shipPixelsOf(shipKind)) {
    const o = shipPoint(dx, dy);
    let x = o.x, y = o.y;
    if (bd) { const ddx = x - bd.x, ddy = y - bd.y, dd = hyp(ddx, ddy) || 1; if (dd < bd.r + 0.5) { x = bd.x + ddx / dd * (bd.r + 0.5); y = bd.y + ddy / dd * (bd.r + 0.5); } }
    const dist = hyp(x - ix, y - iy), wait = Math.min(0.4, dist / (40 + sp * 0.8)); // l'onde de choc part du point d'impact
    // écrasement : le choc écrase l'épave contre l'astre (léger rebond) et les morceaux glissent surtout le long de la surface
    const a = Math.random() * Math.PI * 2, j = 4 + Math.random() * 14, out = bd ? 3 + Math.random() * (6 + sp * 0.08) : 0, keep = 0.65 + Math.random() * 0.4; // l'élan est gardé : à grande vitesse, l'épave file le long de l'astre, voire le dépasse
    let jx = Math.cos(a) * j, jy = Math.sin(a) * j; const jn = jx * nx + jy * ny; if (jn > 0) { jx -= 1.7 * jn * nx; jy -= 1.7 * jn * ny; } // éclats plaqués vers l'astre
    let vx = bvx + tvx * keep + jx + rvn * nx * 0.15, vy = bvy + tvy * keep + jy + rvn * ny * 0.15;
    if (wait < 0.08 && Math.random() < 0.3) { const up = 12 + Math.random() * (18 + sp * 0.12); vx += nx * up; vy += ny * up; } // près de l'impact, quelques éclats remontent (léger rebond)
    if (!bd) { vx = ship.vx * 0.6 + Math.cos(a) * (20 + Math.random() * 60); vy = ship.vy * 0.6 + Math.sin(a) * (20 + Math.random() * 60); }
    if (star) particles.push({ x, y, vx: vx * 0.5, vy: vy * 0.5, wait, life: 0.8 + Math.random() * 1.4, max: 2.2, rgb: Math.random() < 0.5 ? body : col, sz });
    else particles.push({ x, y, vx, vy, wait, life: Infinity, max: 1, rgb: col, sz, grav: true, slide: true }); // l'épave reste jusqu'à la partie suivante
  }
  // un peu de matière de l'astre soulevée à l'impact
  // poussière de l'astre : elle jaillit de la surface autour du point d'impact, puis retombe (environ 4 fois moins de pixels que le vaisseau)
  if (bd && !star) {
    const base = Math.atan2(ny, nx), span = Math.min(0.5, 22 / bd.r), n = 110;
    for (let i = 0; i < n; i++) {
      const pa = base + (Math.random() - 0.5) * 2 * span, px = bd.x + Math.cos(pa) * (bd.r + 0.6), py = bd.y + Math.sin(pa) * (bd.r + 0.6);
      const a = pa + (Math.random() - 0.5) * 1.1, v = 10 + Math.random() * (20 + sp * 0.35), d = hyp(px - ix, py - iy);
      particles.push({ x: px, y: py, vx: bvx + Math.cos(a) * v + tvx * 0.2, vy: bvy + Math.sin(a) * v + tvy * 0.2, wait: Math.min(0.25, d / 120),
        life: Infinity, max: 1, rgb: body, sz: sz * (0.8 + Math.random() * 0.5), grav: true, slide: true }); // reste posée jusqu'à la partie suivante
    }
  }
  ship.dead = true;
}

function drawPath(path, dash) {

// trajectoire sans poussée : pointillés, point blanc si on se pose, croix rouge si crash
// croix masquée juste après le décollage (la trajectoire retombe encore sur l'astre de départ) ;
// elle revient dès que la trajectoire touche un autre astre, ou qu'elle s'est d'abord libérée de tout contact
let crossOff = -1, departT = 0;
// visibilité des numéros d'objectifs : affichés pour préparer la mission, effacés en fondu au décollage

  if (pr.hit && pr.hit.t < 0.1) return;
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; drawPath(pr.path, [2, 6]);
  if (live && crossOff >= 0 && (!pr.hit || pr.hit.p !== crossOff)) crossOff = -1;

  let q = 0;

    const qs = Math.max(0, Math.min(1, 1 - pr.hit.v / (2 * CRASH_SPEED))), qa = Math.max(0, Math.min(1, 1 - pr.hit.da / (2 * LAND_ANGLE)));
    const qd = Math.max(0, Math.min(1, 1 - hyp(x - ship.x, y - ship.y) / 350)); // et de plus en plus vert en approchant (rouge au-delà de 350 m)

}

// caméra des « grands voyages » : la vue (2000 m) suit le vaisseau ; à l'arrivée, balayage de la carte du haut vers le bas
const SWEEP = 3.2;
let sweepT = -1e9, camLast = 0;
const camTarget = () => Math.max(0, Math.min(worldH(L) - WORLD_H, ship.y - WORLD_H * 0.6));
function updateCam() {
  const now = performance.now(), dt = Math.min(0.1, (now - camLast) / 1000); camLast = now;
  if (worldH(L) <= WORLD_H) camY = 0;
  else {
    const a = (now - sweepT) / 1000 / SWEEP;
    if (a < 1) { const e = a < 0.15 ? 0 : (a - 0.15) / 0.85, k = e * e * (3 - 2 * e); camY = camTarget() * k; } // un temps en haut, puis descente douce
    else camY += (camTarget() - camY) * Math.min(1, dt * 4);
  }
  // zoom / déplacement à deux doigts (avant le lancement seulement) ; au décollage, la vue revient doucement à la normale
  if (departed && (view.z !== 1 || view.px || view.py)) {
    const k = Math.min(1, dt * 5);
    view.z += (1 - view.z) * k; view.px -= view.px * k; view.py -= view.py * k;
    if (Math.abs(view.z - 1) < 0.002 && Math.abs(view.px) < 0.5 && Math.abs(view.py) < 0.5) { view.z = 1; view.px = view.py = 0; buildTextures(); }
  }
  scale = baseScale * view.z; ox = baseOx * view.z + view.px; oy = (baseOy - camY * baseScale) * view.z + view.py;
}

// vue avant le lancement : zoom (1 à 4) et déplacement à deux doigts
let view = { z: 1, px: 0, py: 0 }, pinch = null, tapUndo = null;
const gamePtrs = new Map();
function pinchStart() {
  const [a, b] = [...gamePtrs.values()], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, wx: (mx - ox) / scale, wy: (my - oy) / scale, z: view.z };
}
function pinchMove() {
  const [a, b] = [...gamePtrs.values()], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const z = Math.max(1, Math.min(4, pinch.z * (Math.hypot(a.x - b.x, a.y - b.y) || 1) / pinch.d));
  view.z = z; // le point du monde pris entre les doigts reste sous les doigts
  view.px = mx - baseOx * z - pinch.wx * baseScale * z;
  view.py = my - (baseOy - camY * baseScale) * z - pinch.wy * baseScale * z;
  const lim = W * z; view.px = Math.max(-lim, Math.min(lim, view.px)); view.py = Math.max(-H * z, Math.min(H * z, view.py));
}

function draw() {
  if (screen === 'game') updateCam();
  if (screen === 'editor') { editorDraw(); return; }
  if (screen === 'perso' || screen === 'tuto') { drawBackdrop(); return; }
  if (screen === 'home') { drawHome(); return; }
  if (screen === 'levels') { drawLevels(); return; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  // zone de jeu
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  for (const s of bgStars) { ctx.fillStyle = `rgba(255,255,255,${s.a})`; ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.translate(ox, oy); ctx.scale(scale, scale);
  const lw = 1.5 / scale, t = performance.now() / 1000;

  drawLight(B);

  // astre sélectionné : zone de gravité et orbite conseillée
  if (selPlanet >= 0) {
    const p = B[selPlanet], o = influence(B, selPlanet);
    const gr = ctx.createRadialGradient(p.x, p.y, p.r, p.x, p.y, o.soi);
    gr.addColorStop(0, 'rgba(255,255,255,0.22)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(p.x, p.y, o.soi, 0, Math.PI * 2); ctx.fill();
    if (o.ok) {
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = lw; ctx.setLineDash([3 / scale, 6 / scale]);
      ctx.beginPath(); ctx.arc(p.x, p.y, o.rorb, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  // zones à atteindre : fin pointillé ; elles s'effacent avec l'interface à la fin de la partie
  const zoneA = state === 'play' ? 1 : Math.max(0, 1 - stateT / 0.6);
  if (zoneA > 0) L.steps.forEach((st, i) => {
    if (i < mission.step || st.type !== 'zone') return;
    const cur = i === mission.step;
    ctx.strokeStyle = `rgba(255,255,255,${(cur ? 0.9 : 0.4) * zoneA})`; ctx.lineWidth = 1 / scale;
    ctx.setLineDash([2 / scale, 5 / scale]); ctx.lineDashOffset = cur ? -t * 10 / scale : 0;
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (cur && mission.zoneT > 0) {
      ctx.lineWidth = 4 / scale;
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * mission.zoneT / ZONE_TIME); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = `600 ${16 / scale}px ${FONT}`;
      ctx.fillText(Math.ceil(ZONE_TIME - mission.zoneT) + ' s', st.x, st.y);
    } else {
      ctx.font = `600 ${14 / scale}px ${FONT}`; ctx.fillStyle = `rgba(255,255,255,${(cur ? 0.9 : 0.4) * zoneA * badgeAlpha()})`;
      ctx.fillText(String(i + 1), st.x, st.y);
    }
  });

  drawBelts(B, t);
  B.forEach(b => drawBody(B, b));
  drawShadows(B);
  // numéros des objectifs « se poser » et « faire le tour » sur les astres concernés (avant le lancement)
  const ba = badgeAlpha();
  if (ba > 0 && state === 'play') {
    const per = {};
    L.steps.forEach((st, i) => { if (i >= mission.step && st.type !== 'zone') (per[st.p] = per[st.p] || []).push(st.type === 'orbit' ? `${i + 1}↻` : String(i + 1)); });
    for (const [pi, labels] of Object.entries(per)) {
      const b = B[pi]; if (!b) continue;
      const txt = labels.join(' · '), fs = 13 / scale;
      ctx.font = `700 ${fs}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const w = Math.max(24 / scale, ctx.measureText(txt).width + 14 / scale), h = 24 / scale;
      ctx.globalAlpha = ba;
      ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.beginPath(); ctx.roundRect(b.x - w / 2, b.y - h / 2, w, h, h / 2); ctx.fill();
      ctx.fillStyle = '#000'; ctx.fillText(txt, b.x, b.y + 0.5 / scale);
      ctx.globalAlpha = 1;
    }
  }

  // trajectoire de l'aide (solution conseillée)
  if (showHelp && !departed && helpRes && !helpRes.fail) { ctx.strokeStyle = 'rgba(255,255,255,0.8)'; drawPath(helpRes.path, [2, 5]); }

  // simulation vers un point + dérive prévue ensuite
  if (!departed) {
    if (plan && !plan.fail) { ctx.strokeStyle = '#fff'; drawPath(plan.path, [8, 5]); drawCoast(plan.coast); }
    else if (taps.length) { ctx.strokeStyle = 'rgba(255,255,255,0.35)'; drawPath([[ship.x, ship.y]].concat(taps), [4, 6]); }
    taps.forEach(([x, y], i) => {
      ctx.fillStyle = '#000'; ctx.strokeStyle = '#fff'; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.arc(x, y, 11 / scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = `600 ${11 / scale}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(i + 1), x, y + 0.5 / scale);
    });
  }

  // trajectoire prévue sans poussée : visible en vol seulement si on est parti sans simulation
  const pred = departed && state === 'play' && !ship.dead ? predict(L, { ...ship, tw: wt }) : null;
  predHit = pred && pred.hit && pred.hit.p != null ? pred.hit.p : -1;
  if (pred && !simFlight) drawCoast(pred, true);

  for (const q of particles) {
    ctx.fillStyle = `rgba(${q.rgb || '255,255,255'},${Math.max(0, Math.min(1, q.life / q.max))})`;
    const qs = (q.sz || (q.rgb ? 2 : 1.2)) / scale; // poussière d'anneaux un peu plus grosse ; coups de redressement plus fins
    ctx.fillRect(q.x - qs, q.y - qs, qs * 2, qs * 2);
  }

  if (!ship.dead) drawRocket(ship.x, ship.y, ship.ang, Math.max(1, 1.15 / scale), shipDarkness(B, ship.x, ship.y));
  ctx.restore();

  // fin de partie : l'interface s'efface en fondu (le jeu continue de tourner), la question arrive au bout de 3 s
  const hudA = state === 'play' ? 1 : Math.max(0, 1 - stateT / 0.6);
  if (hudA <= 0) { drawEndPanel(); return; }
  let mainCtx = null;
  if (hudA < 1) {
    if (hudCv.width !== cv.width || hudCv.height !== cv.height) { hudCv.width = cv.width; hudCv.height = cv.height; }
    mainCtx = ctx; ctx = hudCv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  }

  // étiquettes
  if (!departed && taps.length && !planJob && (!plan || plan.fail)) {
    const [sx, sy] = toScreen(...taps[taps.length - 1]); label('Aucune route jusque-là', sx, sy - 26);
  }
  if (showHelp && !departed) {
    if (helpJob) label(`Recherche d’une solution… ${Math.round(helpJob.progress * 100)} %`, W / 2, bandTop - 80);
    else if (helpRes && helpRes.locked) label('Solution non partagée : demande-la à ton ami', W / 2, bandTop - 80);
    else if (!helpRes || helpRes.fail) label('Aucune solution trouvée', W / 2, bandTop - 80);
  }

  // indicateur de vitesse : barre juste au-dessus du cercle de commande, qui s'étend du centre vers les côtés
  const speed = Math.hypot(ship.vx, ship.vy);
  const half = Math.min(1, speed / SPEED_BAR_MAX) * W / 2, sby = ctrl.y - ctrl.r - 14;
  if (half > 0.5 && !ship.dead) {
    ctx.fillStyle = pred && pred.hit && pred.hit.crash && pred.hit.t <= 3 ? '#ff3b30' : '#30d158';
    ctx.fillRect(W / 2 - half, sby - 2, half * 2, 5);
  }

  // bandeau de commande (cercle en pointillés légers)
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.5; ctx.setLineDash([2, 6]);
  const live = state === 'play' && curTh;
  const ctlJets = !live ? [] : touches.size ? ctrlJets() : [fixedNorth ? toShip(curTh, -1) : curTh]; // jets dessinés du côté du doigt
  if (fixedNorth) {
    // mode fixe : 4 boutons en croix (avant, arrière, gauche, droite) ; plus on appuie loin du centre, plus ça pousse
    const aw = ctrl.r * 0.5, a0 = ctrl.r * 0.3, R = ctrl.r;
    for (const [ux, uy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
      const x0 = ux ? ctrl.x + ux * (ux > 0 ? a0 : R) : ctrl.x - aw / 2, y0 = uy ? ctrl.y + uy * (uy > 0 ? a0 : R) : ctrl.y - aw / 2;
      const w = ux ? R - a0 : aw, hh = uy ? R - a0 : aw;
      const on = ctlJets.some(v => Math.round(-v.x) === ux && Math.round(-v.y) === uy && v.p > 0);
      ctx.beginPath(); ctx.roundRect(x0, y0, w, hh, 10);
      ctx.fillStyle = on ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.35)'; ctx.fill(); ctx.stroke();
    }
    ctx.setLineDash([]);
  } else {
    ctx.beginPath(); ctx.arc(ctrl.x, ctrl.y, ctrl.r, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  }
  for (const th of ctlJets) {
    const ex = -th.x, ey = -th.y, ir = ctrl.r * 0.22;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.5;
    for (let i = -1; i <= 1; i++) {
      const a = Math.atan2(ey, ex) + i * 0.18, len = ir * (1.2 + th.p * 1.6) * (0.8 + Math.random() * 0.3);
      ctx.beginPath();
      ctx.moveTo(ctrl.x + Math.cos(a) * ir * 0.8, ctrl.y + Math.sin(a) * ir * 0.8);
      ctx.lineTo(ctrl.x + Math.cos(a) * (ir * 0.8 + len), ctrl.y + Math.sin(a) * (ir * 0.8 + len));
      ctx.stroke();
    }
  }
  // petits coups de gaz bleutés du redressement automatique, au nez et à la queue du vaisseau de la commande
  if (state === 'play' && performance.now() - redressFx.t < 120) {
    const a = fixedNorth ? -Math.PI / 2 : ship.ang, ir = ctrl.r * 0.22, px = -Math.sin(a) * redressFx.sg, py = Math.cos(a) * redressFx.sg;
    ctx.strokeStyle = 'rgba(170,215,255,0.9)'; ctx.lineWidth = 1.5;
    for (const [e, k] of [[-1, 0.75], [1, -0.75]]) { // nez : gaz à l'opposé du mouvement ; queue : dans le sens du mouvement
      const ox0 = ctrl.x + Math.cos(a) * ir * k + e * px * ir * 0.35, oy0 = ctrl.y + Math.sin(a) * ir * k + e * py * ir * 0.35;
      for (let i = -1; i <= 1; i += 2) { const sp = i * 0.25, dx = e * px * Math.cos(sp) - e * py * Math.sin(sp), dy = e * px * Math.sin(sp) + e * py * Math.cos(sp), len = ir * (0.5 + Math.random() * 0.3);
        ctx.beginPath(); ctx.moveTo(ox0, oy0); ctx.lineTo(ox0 + dx * len, oy0 + dy * len); ctx.stroke(); }
    }
  }
  const shadowed = state === 'play' && inShadow(B, ship.x, ship.y);
  ctx.globalAlpha = shadowed ? 0.3 : 1;
  shipPath(ctx, ctrl.x, ctrl.y, fixedNorth ? -Math.PI / 2 : ship.ang, ctrl.r * 0.22);
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.globalAlpha = 1;
  ctx.font = `600 12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  ctx.fillText(`${Math.round(speed)} m/s`, ctrl.x, ((ctrl.y - ctrl.r * 0.22) + sby) / 2);
  if (shadowed) { ctx.fillStyle = '#ffb340'; ctx.fillText('Dans l’ombre', ctrl.x, ctrl.y + ctrl.r * 0.55); }
  for (const t of touches.values()) {
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(t.x, t.y, 18, 0, Math.PI * 2); ctx.stroke();
  }

  // icônes de statut : en haut trajectoire temps réel, en bas pilote auto ; l'icône active est allumée
  const autoOn = simFlight || (!departed && taps.length > 0);
  const icon = (cy, on, fn) => {
    ctx.globalAlpha = on ? 1 : 0.25; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(30, cy, 18, 0, Math.PI * 2); ctx.stroke(); fn(30, cy); ctx.globalAlpha = 1;
  };
  icon(ctrl.y - 24, !autoOn, (x, y) => {
    ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(x - 9, y + 8); ctx.quadraticCurveTo(x - 6, y - 9, x + 8, y - 6); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(x + 8, y - 6, 2.5, 0, Math.PI * 2); ctx.fill();
  });
  icon(ctrl.y + 24, autoOn, (x, y) => {
    ctx.beginPath(); ctx.arc(x + 5, y - 5, 4, 0, Math.PI * 2); ctx.stroke();
    shipPath(ctx, x - 4, y + 4, -Math.PI / 4, 7); ctx.fill();
  });

  // bascule boussole / fixe : aiguille qui suit le vaisseau, ou vaisseau fixé avec un N
  {
    const mx = W - 30, my = ctrl.y + 24;
    ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mx, my, 18, 0, Math.PI * 2); ctx.stroke();
    if (fixedNorth) {
      shipPath(ctx, mx, my + 3, -Math.PI / 2, 8); ctx.fill();
      ctx.font = `700 9px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('N', mx, my - 10);
    } else {
      const a = ship.ang, cx2 = Math.cos(a), sy2 = Math.sin(a);
      ctx.beginPath(); ctx.moveTo(mx + cx2 * 12, my + sy2 * 12); ctx.lineTo(mx - sy2 * 4, my + cx2 * 4); ctx.lineTo(mx + sy2 * 4, my - cx2 * 4); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 0.4; ctx.beginPath(); ctx.moveTo(mx - cx2 * 12, my - sy2 * 12); ctx.lineTo(mx - sy2 * 4, my + cx2 * 4); ctx.lineTo(mx + sy2 * 4, my - cx2 * 4); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    }
    ctx.font = `600 10px ${FONT}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(fixedNorth ? 'Fixe' : 'Boussole', mx - 23, my);
  }
  // bouton des réglages du vaisseau : clé à molette
  {
    const mx = W - 30, my = ctrl.y - 24;
    ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mx, my, 18, 0, Math.PI * 2); ctx.stroke();
    ctx.save(); ctx.translate(mx + 1, my + 1); ctx.rotate(Math.PI / 4);
    ctx.lineCap = 'round';
    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 10); ctx.stroke();                        // manche
    ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, -5, 4.5, -Math.PI / 2 + 0.75, -Math.PI / 2 - 0.75); ctx.stroke(); // tête ouverte (mâchoire)
    ctx.lineCap = 'butt';
    ctx.restore();
    ctx.fillStyle = '#fff'; ctx.font = `600 10px ${FONT}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText('Réglages', mx - 23, my);
  }

  // jauge de gravité verticale (bas droite de la zone de jeu) : remplie et rouge = forte gravité, vide et verte = vide spatial
  {
    const [gx, gy] = gravity(B, ship.x, ship.y), g = Math.hypot(gx, gy);
    const tg = Math.max(0, Math.min(1, Math.log10(g / 0.3) / 2));
    const gb = { x: W - 26, y: bandTop - 150, w: 12, h: 120 }, ih = gb.h - 4, fh = Math.max(2, ih * tg);
    ctx.fillStyle = `hsl(${Math.round(120 * (1 - tg))},85%,50%)`;
    ctx.fillRect(gb.x + 2, gb.y + 2 + ih - fh, gb.w - 4, fh);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(gb.x, gb.y, gb.w, gb.h);
    ctx.fillStyle = '#fff'; ctx.font = `600 11px ${FONT}`; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText('Gravité', gb.x + gb.w + 2, gb.y + gb.h + 6);
  }

  // nom du niveau, en fondu rapide à l'entrée
  {
    const hold = worldH(L) > WORLD_H ? SWEEP : 1.4; // plus long pendant le balayage d'un grand voyage
    const a = (performance.now() - nameT) / 1000, al = a < 0.25 ? a / 0.25 : a < hold ? 1 : a < hold + 0.35 ? (hold + 0.35 - a) / 0.35 : 0;
    if (al > 0 && L.name) {
      ctx.globalAlpha = al; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `700 26px ${FONT}`; ctx.fillText(L.name, W / 2, H * 0.36, W - 40); ctx.globalAlpha = 1;
    }
  }

  // bouton de validation de la simulation
  if (canValidate()) {
    const vb = validBtn(), r = vb.w / 2;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ctrl.x, ctrl.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `700 ${Math.round(r * 0.36)}px ${FONT}`; ctx.fillText('Valider', ctrl.x, ctrl.y - r * 0.16);
    ctx.font = `600 ${Math.round(r * 0.22)}px ${FONT}`; ctx.fillText('la trajectoire', ctrl.x, ctrl.y + r * 0.22);
  }

  // jauge de gaz verticale (bas gauche) ; avant le départ, la partie que la simulation (ou l'aide) consommerait clignote
  {
    let need = null;
    if (!departed && taps.length && plan && !plan.fail) need = plan.used;
    else if (!departed && showHelp && helpRes && !helpRes.fail) need = helpRes.used;
    const gb = { x: 14, y: bandTop - 150, w: 12, h: 120 };
    const ih = gb.h - 4, fh = ih * fuel / L.fuel, nh = need === null ? 0 : Math.min(fh, ih * need / L.fuel);
    const bottom = gb.y + 2 + ih, short = need !== null && need > fuel;
    ctx.fillStyle = '#fff'; ctx.fillRect(gb.x + 2, bottom - (fh - nh), gb.w - 4, fh - nh);
    if (nh > 0) {
      const pulse = 0.3 + 0.5 * (0.5 + 0.5 * Math.sin(performance.now() / 180));
      ctx.fillStyle = short ? `rgba(255,59,48,${pulse})` : `rgba(255,255,255,${pulse})`;
      ctx.fillRect(gb.x + 2, bottom - fh, gb.w - 4, nh);
    }
    // repère des 50 % (objectif réserve)
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(gb.x - 4, gb.y + gb.h / 2, 4, 1);
    ctx.strokeStyle = short ? '#ff3b30' : '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(gb.x, gb.y, gb.w, gb.h);
    ctx.fillStyle = '#fff'; ctx.font = `600 11px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('Gaz', gb.x - 2, gb.y + gb.h + 6);
  }

  // explication d'une icône de statut (avant le lancement)
  if (tip && !departed && performance.now() < tip.until) {
    const b = statusIcons()[tip.i], tl = TIPS[tip.i];
    const bx = b.x + b.w + 8, bw = Math.min(W - bx - 8, 250), bh = 14 + tl.length * 16, by = Math.max(bandTop + 4, b.y + b.h / 2 - bh / 2);
    ctx.fillStyle = 'rgba(0,0,0,0.92)'; ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, bw, bh);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
    tl.forEach((s, i) => { ctx.font = `${i ? 400 : 700} 12px ${FONT}`; ctx.fillText(s, bx + 8, by + 15 + i * 16, bw - 16); });
  }

  // barre du haut : niveau + chrono, aide, recommencer
  const hy = safeTop + 28;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.font = `600 15px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = `400 28px ${FONT}`; ctx.fillText('\u2039', 12, hy - 2); // retour à la liste des niveaux
  ctx.font = `600 15px ${FONT}`;
  ctx.fillText(levelTitle(), 34, hy, W - 210);
  if (departed) {
    const lw0 = Math.min(W - 210, ctx.measureText(levelTitle()).width) + 20;
    ctx.font = `400 14px ${FONT}`; ctx.fillStyle = elapsed > L.time ? 'rgba(255,255,255,0.5)' : '#fff';
    ctx.fillText(`· ${fmt(elapsed)} s`, 14 + lw0 + 6, hy);
    ctx.fillStyle = '#fff';
  }
  let b = restartBtn();
  ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 18); ctx.stroke();
  ctx.font = `600 14px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('Recommencer', b.x + b.w / 2, b.y + b.h / 2 + 1);
  if (!departed && state === 'play') {
    b = helpBtn(); const cx = b.x + b.w / 2, cy = b.y + b.h / 2, open = helpOpen();
    ctx.globalAlpha = open ? 1 : 0.35; // verrouillée : grisée tant qu'on n'a pas échoué 5 fois
    ctx.beginPath(); ctx.arc(cx, cy, 13, 0, Math.PI * 2);
    if (showHelp) { ctx.fill(); ctx.fillStyle = '#000'; } else ctx.stroke();
    ctx.font = `700 14px ${FONT}`; ctx.fillText('?', cx, cy + 1);
    ctx.fillStyle = '#fff'; ctx.globalAlpha = 1;
    if (!open && performance.now() - helpTipT < 2500) { const n = HELP_TRIES - failsOf(); label(`Solution après ${HELP_TRIES} tentatives (encore ${n})`, W / 2, bandTop - 80); ctx.fillStyle = '#fff'; }
  }

  // mission complète : étapes faites cochées, étape en cours en blanc (ombre portée pour rester lisible sur les astres)
  ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 4;
  ctx.font = `400 13px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  L.steps.forEach((st, i) => {
    ctx.fillStyle = i === mission.step ? '#fff' : `rgba(255,255,255,${i < mission.step ? 0.4 : 0.6})`;
    let txt = `${i < mission.step ? '✓' : (i + 1) + '.'} ${stepText(L, st)}`;
    if (st.type === 'orbit' && i === mission.step && mission.orbA) txt += ` (${fmt(Math.min(st.n, Math.abs(mission.orbA) / (Math.PI * 2)))}/${st.n})`;
    ctx.fillText(txt, 14, hy + 28 + i * 18);
  });
  // objectifs bonus (★ déjà obtenu)
  const md = (playCtx ? L.stars : medals[lvl]) || [false, false, false];
  ctx.font = `400 12px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText(`${md[1] ? '★' : '☆'} Gaz ≥ 50 %   ${md[2] ? '★' : '☆'} Chrono ≤ ${L.time} s`, 14, hy + 28 + L.steps.length * 18);
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';

  if (mainCtx) { ctx = mainCtx; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = hudA; ctx.drawImage(hudCv, 0, 0); ctx.restore(); }
  drawEndPanel();
}

// question de fin, dans la zone de commande, 3 s après le crash ou l'atterrissage réussi
const hudCv = document.createElement('canvas'), END_DELAY = 3;
const endBtns = () => {
  const y = H - Math.max(safeBot, 10) - 58;
  if (testMode && state === 'won' && testRuns) { const w = Math.min(112, (W - 48) / 3); return [-1, 0, 1].map(k => ({ x: W / 2 - w / 2 + k * (w + 8), y, w, h: 46 })); } // éditeur : Rejouer · Éditeur · Analyser
  const w = Math.min(150, (W - 44) / 2); return [{ x: W / 2 - w - 6, y, w, h: 46 }, { x: W / 2 + 6, y, w, h: 46 }];
};
function drawEndPanel() {
  if (state === 'play' || stateT < END_DELAY) return;
  const a = Math.min(1, (stateT - END_DELAY) / 0.5), top = bandTop - 10;
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(0, top - 40, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.35, 'rgba(0,0,0,0.6)'); g.addColorStop(1, 'rgba(0,0,0,0.85)');
  ctx.fillStyle = g; ctx.fillRect(0, top - 40, W, H - top + 40);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const [b1, b2] = endBtns(), ty = b1.y - 92;
  if (state === 'won') {
    ctx.font = `700 22px ${FONT}`; ctx.fillText('Mission accomplie !', W / 2, ty);
    ctx.font = `500 22px ${FONT}`;
    const nst = result.got.filter(Boolean).length;
    for (let k = 0; k < 3; k++) { const ok = k < nst; ctx.fillStyle = ok ? '#ffd60a' : 'rgba(255,255,255,0.35)'; ctx.fillText(ok ? '★' : '☆', W / 2 + (k - 1) * 30, ty + 32); }
    ctx.font = `400 13px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(`Gaz restant ${Math.round(result.fuelPct)} % · ${fmt(result.time)} s (objectif ${L.time} s)`, W / 2, ty + 60);
  } else {
    ctx.font = `700 22px ${FONT}`; ctx.fillText(msg, W / 2, ty + 14, W - 30);
    if (sub) { ctx.font = `400 14px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillText(sub, W / 2, ty + 44, W - 30); }
  }
  const next = testMode ? 'Éditeur' : playCtx ? 'Mes niveaux' : state === 'won' ? (lvl + 1 < LV.length ? 'Suivant' : 'Niveaux') : 'Niveaux';
  button(b1, 'Rejouer', state !== 'won'); button(b2, next, state === 'won' && !testRuns);
  const b3 = endBtns()[2]; if (b3) button(b3, 'Analyser', true);
  ctx.restore();
}
function endAction(which) { // 0 : rejouer ; 1 : suite ; 2 : analyser le vol réussi (éditeur)
  if (which === 0) { loadLevel(lvl, testMode || playCtx ? L : undefined); return; }
  if (which === 2 && testRuns) { const r = testRuns; testRuns = null; recordDone(r); return; }
  cancelJobs();
  if (testMode) backToEditor(); else if (playCtx) openPerso();
  else if (state === 'won' && lvl + 1 < LV.length) loadLevel(lvl + 1);
  else screen = 'levels';
}

// écran toujours allumé pendant une partie (Wake Lock), relancé au retour dans l'appli
let wakeLock = null, wakeWant = false;
async function keepAwake(on) {
  wakeWant = on;
  try {
    if (on && !wakeLock && 'wakeLock' in navigator && document.visibilityState === 'visible') { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if (!on && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
  } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wakeWant) keepAwake(true); });

// ===== Boucle : pas de temps fixe =====
let last = performance.now(), acc = 0;
function loop(now) {
  const fdt = Math.min(0.1, (now - last) / 1000); last = now;
  acc += fdt;
  let n = 0;
  while (acc >= DT && n < 6) { if (screen === 'game' && !document.querySelector('.modal')) tick(); acc -= DT; n++; } // jeu en pause sous une fenêtre
  if (n === 6) acc = 0;
  stateT += fdt;
  if ((screen === 'game') !== wakeWant) keepAwake(screen === 'game');
  for (const q of particles) {
    if (q.wait > 0) { q.wait -= fdt; continue; } // pixel encore accroché à l'épave : il part quand l'onde de choc l'atteint
    if (!q.grav && !q.rgb && B && screen === 'game') { // gaz du réacteur : il s'écrase sur l'astre et file le long de sa surface (décollage, atterrissage)
      for (const b of B) {
        if (b.star) continue;
        const dx = q.x - b.x, dy = q.y - b.y, d2 = dx * dx + dy * dy;
        if (d2 >= b.r * b.r) continue;
        const d = Math.sqrt(d2) || 1, nx = dx / d, ny = dy / d, rvx = q.vx - b.vx, rvy = q.vy - b.vy, vn = rvx * nx + rvy * ny;
        q.x = b.x + nx * b.r; q.y = b.y + ny * b.r;
        if (vn < 0) { const tx = rvx - vn * nx, ty = rvy - vn * ny, k = 1 + 0.6 * Math.min(1, -vn / 120); q.vx = b.vx + tx * k - vn * nx * 0.12; q.vy = b.vy + ty * k - vn * ny * 0.12; }
        q.rgb = bodyColor(b.i); q.dust = true; q.life = Math.max(q.life, 0.35 + Math.random() * 0.35); q.max = 0.7;
        break;
      }
    }
    if (q.dust && B) { q.vx *= 1 - Math.min(1, 2.2 * fdt); q.vy *= 1 - Math.min(1, 2.2 * fdt); } // la poussière soulevée ralentit vite
    if (q.grav && B) { // débris d'anneaux : gravité des astres, et ils s'écrasent à leur surface
      const [ax, ay] = gravity(B, q.x, q.y); q.vx += ax * fdt; q.vy += ay * fdt;
      const rk = q.slide ? beltRockAt(q.x, q.y) : null; // les débris rebondissent et glissent aussi sur les cailloux des ceintures
      for (const b of rk ? [rk] : B) {
        const dx = q.x - b.x, dy = q.y - b.y, d2 = dx * dx + dy * dy;
        if (d2 >= b.r * b.r) continue;
        if (!q.slide || b.star) { q.life = 0; break; }
        // morceau du vaisseau : il se pose et glisse sur la surface (petit rebond, frottement)
        const d = Math.sqrt(d2) || 1, nx = dx / d, ny = dy / d, rvx = q.vx - b.vx, rvy = q.vy - b.vy, vn = rvx * nx + rvy * ny;
        q.x = b.x + nx * b.r; q.y = b.y + ny * b.r;
        if (vn < 0) { const tx = rvx - vn * nx, ty = rvy - vn * ny, f = Math.max(0, 1 - 1.1 * fdt); q.vx = b.vx + tx * f - vn * nx * 0.08; q.vy = b.vy + ty * f - vn * ny * 0.08; } // frottement léger : ça glisse loin
        break;
      }
    }
    q.x += q.vx * fdt; q.y += q.vy * fdt; q.life -= fdt;
  }
  particles = particles.filter(q => q.life > 0 && (!q.slide || (q.x > -2000 && q.x < WORLD_W + 2000 && q.y > -2000 && q.y < worldH(L) + 2000))); // l'épave partie très loin est oubliée
  if (particles.length > 2500) particles = particles.slice(particles.length - 2500); // plafond (les plus anciens partent)
  draw();
  requestAnimationFrame(loop);
}

addEventListener('resize', resize);
resize(); loadLevel(lvl);
requestAnimationFrame(loop);

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
